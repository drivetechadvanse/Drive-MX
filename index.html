<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX - Logística</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .btn-primary { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; font-size: 0.75rem; background: #ef4444; color: white; border-radius: 0.75rem; padding: 0.75rem 1.5rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.3); background: #dc2626; }
        .card-glass { background: white; border: 1px solid #e2e8f0; border-radius: 1.5rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); }
        .input-field { font-size: 0.85rem; background: #f1f5f9; border-radius: 0.75rem; padding: 0.85rem 1rem; width: 100%; border: 2px solid transparent; transition: all 0.2s; font-weight: 600; }
        .input-field:focus { background: white; border-color: #ef4444; outline: none; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide { animation: slideUp 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, onSnapshot, deleteDoc, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDOK0wHv1gV5_wB4OSbYjDcL9lmLEg_Rdo",
            authDomain: "drivemx-paqueteria.firebaseapp.com",
            projectId: "drivemx-paqueteria",
            storageBucket: "drivemx-paqueteria.firebasestorage.app",
            messagingSenderId: "486434579543",
            appId: "1:486434579543:web:8fe53f54b1446644236f12",
            measurementId: "G-QDWX6CHWRM"
        };

        window.firebaseConfig = firebaseConfig;
        window.FirebaseSDK = { initializeApp, getAuth, onAuthStateChanged, signInAnonymously, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, getFirestore, doc, getDoc, setDoc, collection, onSnapshot, deleteDoc, query, getStorage, ref, uploadBytes, getDownloadURL };
    </script>

    <script type="text/babel" data-presets="react">
        const { useState, useEffect } = React;
        const fbase = window.FirebaseSDK;
        
        const Icons = {
            Truck: ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-5l-4-4h-3v10h3Z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>,
            Trash: ({size=14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
            LogOut: ({size=14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>,
            ChevronLeft: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>,
            ChevronRight: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>,
            Menu: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>,
            Send: ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>,
            Cart: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h8.9a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        };

        const STEPS = ['Recolectado', 'Procesando', 'En Camino', 'Entregado'];
        const appId = window.firebaseConfig.projectId;
        const ADMIN_EMAIL = 'admin@drivemx.com';
        const STAFF_USERS_COLLECTION = 'operators';
        const PUBLIC_PRODUCTS_COLLECTION = 'products';
        const ADMIN_PRODUCTS_COLLECTION = 'admin_products';
        const USER_PRODUCTS_COLLECTION = 'user_products';
        const PRODUCT_ORIGIN_CONTROL = 'panel_control';
        const PRODUCT_ORIGIN_USER = 'usuario';
        const STAFF_USERS_LOCAL_KEY = 'driveMxOperators';
        const ADMIN_PRODUCTS_LOCAL_KEY = 'driveMxAdminProducts';
        const VISITOR_CART_LOCAL_KEY = 'driveMxVisitorCart';
        const VISITOR_CART_MAX_ITEMS = 2;
        const VISITOR_CART_TTL_MS = 1000 * 60 * 60 * 24;
        const CART_CHECKOUT_PRODUCT_ID = '__drive_mx_cart_checkout__';
        const SALE_NOTIFICATION_MESSAGE = 'Tu producto ha sido vendido. Comunícate al 5633535701 o 5617549756 para la recolección de tu paquete.';
        const readLocal = (key) => { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) { return []; } };
        const writeLocal = (key, data) => { try { localStorage.setItem(key, JSON.stringify(data)); } catch(e) {} };
        const getProductGallery = (product) => {
            const legacyImage = product?.imageUrl || product?.image || '';
            const gallery = Array.isArray(product?.images) ? product.images.filter(Boolean) : [];
            if (gallery.length > 0) return gallery.slice(0, 5);
            return legacyImage ? [legacyImage] : [];
        };

        const getProductsTotal = (items = []) => items.reduce((total, item) => total + Number(item?.price || 0), 0);

        const normalizeCartProduct = (product = {}) => {
            const gallery = getProductGallery(product);
            return {
                id: String(product.id || '').trim(),
                name: String(product.name || '').trim(),
                price: Number(product.price || 0),
                stock: product.stock ?? '',
                image: gallery[0] || product.imageUrl || product.image || '',
                ownerId: product.ownerId || product.sellerId || '',
                ownerName: product.ownerName || product.sellerName || '',
                ownerEmail: product.ownerEmail || product.sellerEmail || '',
                ownerPhone: product.ownerPhone || product.sellerPhone || '',
                saleNotificationEmail: product.saleNotificationEmail || product.sellerNotificationEmail || product.notificationEmail || '',
                sellerNotificationEmail: product.sellerNotificationEmail || product.saleNotificationEmail || product.notificationEmail || ''
            };
        };

        const readVisitorCart = () => {
            try {
                const raw = localStorage.getItem(VISITOR_CART_LOCAL_KEY);
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                if (parsed?.expiresAt && Number(parsed.expiresAt) < Date.now()) {
                    localStorage.removeItem(VISITOR_CART_LOCAL_KEY);
                    return [];
                }
                const items = Array.isArray(parsed) ? parsed : (Array.isArray(parsed?.items) ? parsed.items : []);
                return items.map(normalizeCartProduct).filter(item => item.id).slice(0, VISITOR_CART_MAX_ITEMS);
            } catch(e) {
                return [];
            }
        };

        const writeVisitorCart = (items = []) => {
            try {
                const normalized = items.map(normalizeCartProduct).filter(item => item.id).slice(0, VISITOR_CART_MAX_ITEMS);
                if (normalized.length === 0) {
                    localStorage.removeItem(VISITOR_CART_LOCAL_KEY);
                    return;
                }
                localStorage.setItem(VISITOR_CART_LOCAL_KEY, JSON.stringify({
                    items: normalized,
                    updatedAt: Date.now(),
                    expiresAt: Date.now() + VISITOR_CART_TTL_MS
                }));
            } catch(e) {}
        };

        const App = () => {
            const [view, setView] = useState('home');
            const [fbUser, setFbUser] = useState(null);
            const [sessionUser, setSessionUser] = useState(null);
            const [pkgs, setPkgs] = useState(() => readLocal('driveMxPackages'));
            const [users, setUsers] = useState(() => readLocal(STAFF_USERS_LOCAL_KEY));
            const [products, setProducts] = useState(() => readLocal('driveMxProducts'));
            const [adminProducts, setAdminProducts] = useState(() => readLocal(ADMIN_PRODUCTS_LOCAL_KEY));
            const [userPanelProducts, setUserPanelProducts] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');
            const [trackingResult, setTrackingResult] = useState(null);
            const [trackingNotFound, setTrackingNotFound] = useState(false);
            const [guideQuery, setGuideQuery] = useState('');
            const [guideResult, setGuideResult] = useState(null);
            const [guideNotFound, setGuideNotFound] = useState(false);
            const [loginForm, setLoginForm] = useState({ email: '', p: '' });
            const [pkgForm, setPkgForm] = useState({ id: '', o: '', d: '', op: '', productId: '' });
            const [userForm, setUserForm] = useState({ email: '', p: '', n: '', phone: '' });
            const [productForm, setProductForm] = useState({ id: '', name: '', price: '', stock: '', description: '', specifications: '', images: [], image: '', imageUrl: '', active: true });
            const [productImageFiles, setProductImageFiles] = useState([]);
            const [productUploading, setProductUploading] = useState(false);
            const [editingProductId, setEditingProductId] = useState(null);
            const [selectedProductId, setSelectedProductId] = useState(null);
            const [currentImageIndex, setCurrentImageIndex] = useState(0);
            const [cartItems, setCartItems] = useState(() => readVisitorCart());
            const [showCartModal, setShowCartModal] = useState(false);
            const [deliveryForm, setDeliveryForm] = useState({ street: '', state: '', municipality: '', neighborhood: '', zip: '', fullName: '', phone: '', email: '', references: '' });
            const [emailSettings, setEmailSettings] = useState(() => { try { return JSON.parse(localStorage.getItem('driveMxEmailSettings') || '{\"senderEmail\":\"\",\"appPassword\":\"\",\"receiverEmail\":\"\"}'); } catch(e) { return { senderEmail: '', appPassword: '', receiverEmail: '' }; } });
            const [paymentSettings, setPaymentSettings] = useState(() => { try { return JSON.parse(localStorage.getItem('driveMxPaymentSettings') || '{\"bankAccount\":\"\",\"paypalClientId\":\"\",\"paypalClientSecret\":\"\"}'); } catch(e) { return { bankAccount: '', paypalClientId: '', paypalClientSecret: '' }; } });
            const [pendingTransfers, setPendingTransfers] = useState(() => readLocal('driveMxPendingTransfers'));
            const [completedSales, setCompletedSales] = useState(() => readLocal('driveMxCompletedSales'));
            const [transferTrackingDrafts, setTransferTrackingDrafts] = useState({});
            const [emailSaving, setEmailSaving] = useState(false);
            const [paymentSaving, setPaymentSaving] = useState(false);
            const [orderSending, setOrderSending] = useState(false);
            const [selectedPaymentMethod, setSelectedPaymentMethod] = useState('paypal');
            const [showUserModal, setShowUserModal] = useState(false);
            const [supportChats, setSupportChats] = useState(() => readLocal('driveMxSupportChats'));
            const [supportInput, setSupportInput] = useState('');
            const [activeSupportChatId, setActiveSupportChatId] = useState('');
            const [showAdminMenu, setShowAdminMenu] = useState(false);
            const [showUserMenu, setShowUserMenu] = useState(false);
            const [assignmentsUnlocked, setAssignmentsUnlocked] = useState(false);
            const [showAssignmentsPasswordModal, setShowAssignmentsPasswordModal] = useState(false);
            const [assignmentsPassword, setAssignmentsPassword] = useState('');
            const [assignmentsPasswordError, setAssignmentsPasswordError] = useState('');
            const [assignmentsUnlocking, setAssignmentsUnlocking] = useState(false);
            const [saleNotificationEmail, setSaleNotificationEmail] = useState('');
            const [saleNotificationSaving, setSaleNotificationSaving] = useState(false);
            const [userProductForm, setUserProductForm] = useState({ id: '', name: '', price: '', stock: '', description: '', specifications: '', images: [], image: '', imageUrl: '', active: true });
            const [userProductImageFiles, setUserProductImageFiles] = useState([]);
            const [userProductUploading, setUserProductUploading] = useState(false);
            const [editingUserProductId, setEditingUserProductId] = useState(null);

            useEffect(() => {
                if (view === 'operator') return;
                setShowUserMenu(false);
                setAssignmentsUnlocked(false);
                setShowAssignmentsPasswordModal(false);
                setAssignmentsPassword('');
                setAssignmentsPasswordError('');
                setAssignmentsUnlocking(false);
            }, [view]);

            useEffect(() => {
                if (!sessionUser || sessionUser.role === 'admin') return;
                setSaleNotificationEmail(sessionUser.saleNotificationEmail || sessionUser.email || '');
            }, [sessionUser?.uid, sessionUser?.id, sessionUser?.email, sessionUser?.saleNotificationEmail, sessionUser?.role]);

            useEffect(() => {
                writeVisitorCart(cartItems);
            }, [cartItems]);

            useEffect(() => {
                const app = fbase.initializeApp(window.firebaseConfig);
                const auth = fbase.getAuth(app);
                fbase.signInAnonymously(auth).catch((err) => { console.error('Firebase Auth:', err); setFbUser({ uid: 'local' }); });
                return fbase.onAuthStateChanged(auth, (user) => setFbUser(user || { uid: 'local' }));
            }, []);

            useEffect(() => {
                if (!fbUser) return;
                const db = fbase.getFirestore();
                const pkgCol = fbase.collection(db, 'artifacts', appId, 'public', 'data', 'packages');
                const userCol = fbase.collection(db, 'artifacts', appId, 'public', 'data', STAFF_USERS_COLLECTION);
                const productCol = fbase.collection(db, 'artifacts', appId, 'public', 'data', PUBLIC_PRODUCTS_COLLECTION);
                const adminProductCol = fbase.collection(db, 'artifacts', appId, 'public', 'data', ADMIN_PRODUCTS_COLLECTION);
                const transferCol = fbase.collection(db, 'artifacts', appId, 'public', 'data', 'bank_transfers');
                const completedSalesCol = fbase.collection(db, 'artifacts', appId, 'public', 'data', 'completed_sales');
                const supportCol = fbase.collection(db, 'artifacts', appId, 'public', 'data', 'support_chats');
                const mailSettingsRef = fbase.doc(db, 'artifacts', appId, 'public', 'data', 'mail_settings', 'config');
                const paymentSettingsRef = fbase.doc(db, 'artifacts', appId, 'public', 'data', 'payment_settings', 'config');
                
                const unsubPkgs = fbase.onSnapshot(pkgCol, (s) => {
                    const l = []; s.forEach(d => l.push(d.data()));
                    setPkgs(l);
                    writeLocal('driveMxPackages', l);
                }, (err) => { console.error('Firestore paquetes:', err); });

                const unsubUsers = fbase.onSnapshot(userCol, (s) => {
                    const l = []; s.forEach(d => l.push({ id: d.id, ...d.data() }));
                    setUsers(l);
                    writeLocal(STAFF_USERS_LOCAL_KEY, l);
                }, (err) => { console.error('Firestore usuarios:', err); });

                const unsubProducts = fbase.onSnapshot(productCol, (s) => {
                    const l = []; s.forEach(d => l.push(d.data()));
                    setProducts(l);
                    writeLocal('driveMxProducts', l);
                }, (err) => { console.error('Firestore productos públicos:', err); });

                const unsubAdminProducts = fbase.onSnapshot(adminProductCol, (s) => {
                    const l = []; s.forEach(d => l.push({ id: d.id, ...d.data() }));
                    l.sort((a, b) => Number(b.updatedAt || b.createdAt || 0) - Number(a.updatedAt || a.createdAt || 0));
                    setAdminProducts(l);
                    writeLocal(ADMIN_PRODUCTS_LOCAL_KEY, l);
                }, (err) => { console.error('Firestore productos Panel de Control:', err); });

                const unsubTransfers = fbase.onSnapshot(transferCol, (s) => {
                    const l = []; s.forEach(d => l.push({ id: d.id, ...d.data() }));
                    l.sort((a, b) => Number(b.createdAt || 0) - Number(a.createdAt || 0));
                    setPendingTransfers(l);
                    writeLocal('driveMxPendingTransfers', l);
                }, (err) => { console.error('Firestore transferencias:', err); });

                const unsubCompletedSales = fbase.onSnapshot(completedSalesCol, (s) => {
                    const l = []; s.forEach(d => l.push({ id: d.id, ...d.data() }));
                    l.sort((a, b) => Number(b.soldAt || b.createdAt || 0) - Number(a.soldAt || a.createdAt || 0));
                    setCompletedSales(l);
                    writeLocal('driveMxCompletedSales', l);
                }, (err) => { console.error('Firestore ventas realizadas:', err); });

                const unsubMailSettings = fbase.onSnapshot(mailSettingsRef, (snap) => {
                    if (!snap.exists()) return;
                    const data = snap.data() || {};
                    const next = {
                        senderEmail: data.senderEmail || '',
                        appPassword: data.appPassword || '',
                        receiverEmail: data.receiverEmail || ''
                    };
                    setEmailSettings(next);
                    try { localStorage.setItem('driveMxEmailSettings', JSON.stringify(next)); } catch(e) {}
                }, (err) => { console.error('Firestore configuración correo:', err); });

                const unsubSupportChats = fbase.onSnapshot(supportCol, (s) => {
                    const l = []; s.forEach(d => l.push({ id: d.id, ...d.data() }));
                    l.sort((a, b) => Number(b.updatedAt || b.createdAt || 0) - Number(a.updatedAt || a.createdAt || 0));
                    setSupportChats(l);
                    writeLocal('driveMxSupportChats', l);
                }, (err) => { console.error('Firestore soporte:', err); });

                const unsubPaymentSettings = fbase.onSnapshot(paymentSettingsRef, (snap) => {
                    if (!snap.exists()) return;
                    const data = snap.data() || {};
                    const next = {
                        bankAccount: data.bankAccount || '',
                        paypalClientId: data.paypalClientId || '',
                        paypalClientSecret: data.paypalClientSecret || ''
                    };
                    setPaymentSettings(next);
                    try { localStorage.setItem('driveMxPaymentSettings', JSON.stringify(next)); } catch(e) {}
                }, (err) => { console.error('Firestore configuración pagos:', err); });

                return () => { unsubPkgs(); unsubUsers(); unsubProducts(); unsubAdminProducts(); unsubTransfers(); unsubCompletedSales(); unsubSupportChats(); unsubMailSettings(); unsubPaymentSettings(); };
            }, [fbUser]);

            useEffect(() => {
                if (!fbUser || !sessionUser || sessionUser.role === 'admin') {
                    setUserPanelProducts([]);
                    return;
                }
                const userDocId = String(sessionUser.uid || sessionUser.id || '').trim().replace(/[^a-zA-Z0-9_-]/g, '_');
                if (!userDocId) {
                    setUserPanelProducts([]);
                    return;
                }
                const localKey = `driveMxUserProducts_${userDocId}`;
                setUserPanelProducts(readLocal(localKey));
                const db = fbase.getFirestore();
                const userProductCol = fbase.collection(db, 'artifacts', appId, 'public', 'data', USER_PRODUCTS_COLLECTION, userDocId, 'items');
                const unsubUserProducts = fbase.onSnapshot(userProductCol, (s) => {
                    const l = []; s.forEach(d => l.push({ id: d.id, ...d.data() }));
                    l.sort((a, b) => Number(b.updatedAt || b.createdAt || 0) - Number(a.updatedAt || a.createdAt || 0));
                    setUserPanelProducts(l);
                    writeLocal(localKey, l);
                }, (err) => { console.error('Firestore productos Panel de Usuario:', err); });
                return () => unsubUserProducts();
            }, [fbUser, sessionUser?.uid, sessionUser?.id, sessionUser?.role]);

            const saveDoc = async (col, id, data) => {
                if (col === 'packages') {
                    setPkgs(prev => { const next = [...prev.filter(x => x.id !== id), data]; writeLocal('driveMxPackages', next); return next; });
                }
                if (col === STAFF_USERS_COLLECTION) {
                    setUsers(prev => { const next = [...prev.filter(x => x.id !== id), { id, ...data }]; writeLocal(STAFF_USERS_LOCAL_KEY, next); return next; });
                }
                if (col === PUBLIC_PRODUCTS_COLLECTION) {
                    setProducts(prev => { const next = [...prev.filter(x => x.id !== id), data]; writeLocal('driveMxProducts', next); return next; });
                }
                if (col === ADMIN_PRODUCTS_COLLECTION) {
                    setAdminProducts(prev => { const next = [...prev.filter(x => x.id !== id), { id, ...data }].sort((a, b) => Number(b.updatedAt || b.createdAt || 0) - Number(a.updatedAt || a.createdAt || 0)); writeLocal(ADMIN_PRODUCTS_LOCAL_KEY, next); return next; });
                }
                if (col === 'bank_transfers') {
                    setPendingTransfers(prev => { const next = [{ id, ...data }, ...prev.filter(x => x.id !== id)]; writeLocal('driveMxPendingTransfers', next); return next; });
                }
                if (col === 'completed_sales') {
                    setCompletedSales(prev => { const next = [{ id, ...data }, ...prev.filter(x => x.id !== id)].sort((a, b) => Number(b.soldAt || b.createdAt || 0) - Number(a.soldAt || a.createdAt || 0)); writeLocal('driveMxCompletedSales', next); return next; });
                }
                if (col === 'support_chats') {
                    setSupportChats(prev => { const next = [{ id, ...data }, ...prev.filter(x => x.id !== id)].sort((a, b) => Number(b.updatedAt || b.createdAt || 0) - Number(a.updatedAt || a.createdAt || 0)); writeLocal('driveMxSupportChats', next); return next; });
                }
                try {
                    const db = fbase.getFirestore();
                    await fbase.setDoc(fbase.doc(db, 'artifacts', appId, 'public', 'data', col, id), data);
                } catch(err) {
                    console.error('Firestore guardar:', err);
                }
            };

            const deletePkg = async (id) => {
                setPkgs(prev => { const next = prev.filter(x => x.id !== id); writeLocal('driveMxPackages', next); return next; });
                try {
                    const db = fbase.getFirestore();
                    await fbase.deleteDoc(fbase.doc(db, 'artifacts', appId, 'public', 'data', 'packages', id));
                } catch(err) { console.error('Firestore borrar paquete:', err); }
            };

            const deleteUser = async (id) => {
                setUsers(prev => { const next = prev.filter(x => x.id !== id); writeLocal(STAFF_USERS_LOCAL_KEY, next); return next; });
                try {
                    const db = fbase.getFirestore();
                    await fbase.deleteDoc(fbase.doc(db, 'artifacts', appId, 'public', 'data', STAFF_USERS_COLLECTION, id));
                } catch(err) { console.error('Firestore borrar usuario:', err); }
            };

            const getSessionUserId = () => sessionUser?.uid || sessionUser?.id || '';
            const normalizeOwnerValue = (value) => String(value || '').trim();
            const getProductOwnerId = (product = {}) => product.ownerId || product.sellerId || product.userId || product.createdByUid || '';
            const getProductPublicationType = (product = {}) => String(product.publicationType || product.productOrigin || product.sourcePanel || product.createdFromPanel || '').toLowerCase().trim();
            const isUserPanelPublication = (product = {}) => {
                const type = getProductPublicationType(product);
                return type === PRODUCT_ORIGIN_USER || type === 'user' || type === 'panel_usuario' || type === 'panel-usuario' || type === 'panel de usuario' || Boolean(getProductOwnerId(product));
            };
            const isControlPanelProduct = (product = {}) => {
                const type = getProductPublicationType(product);
                if (isUserPanelPublication(product)) return false;

                const profileRef = fbase.doc(db, 'artifacts', appId, 'public', 'data', STAFF_USERS_COLLECTION, user.uid);
                const profileSnap = await fbase.getDoc(profileRef);
                if (profileSnap.exists()) return { id: user.uid, uid: user.uid, email: user.email, ...profileSnap.data() };

                if ((user.email || '').toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                    const adminProfile = {
                        uid: user.uid,
                        email: user.email,
                        name: 'Admin Central',
                        role: 'admin',
                        active: true,
                        createdAt: Date.now(),
                        updatedAt: Date.now()
                    };
                    await saveDoc(STAFF_USERS_COLLECTION, user.uid, adminProfile);
                    return { id: user.uid, ...adminProfile };
                }

                return null;
            };

                    setSessionUser(profile);
                    setAssignmentsUnlocked(false);
                    setShowUserMenu(false);
                    setShowAssignmentsPasswordModal(false);

                    setAssignmentsPasswordError('');
                    setLoginForm({ email: '', p: '' });

                    console.error('Login Firebase Auth:', err);
                    setLoginForm(prev => ({ ...prev, p: '' }));
                    alert('Correo o contraseña incorrectos.');
                }

                setShowAssignmentsPasswordModal(false);

            const saveEmailSettings = async (e) => {

            const saveSaleNotificationEmail = async (e) => {
                e.preventDefault();
                const userId = getSessionUserId();

                    return;

                const next = {
                    ...sessionUser,

                    email: sessionUser?.email || '',
                    saleNotificationEmail: email,
                    updatedAt: Date.now(),
                    updatedBy: sessionUser?.email || ''
                };
                setSaleNotificationSaving(true);
                try {
                    await saveDoc(STAFF_USERS_COLLECTION, userId, next);

                    for (const product of ownedProducts) {

                            ...product,

            const savePaymentSettings = async (e) => {
