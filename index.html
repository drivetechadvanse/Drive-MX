                                                    <div className="grid grid-cols-2 gap-2">
                                                        {STEPS.map((s, i) => (
                                                            <button key={s} onClick={() => updateAssignedPackageStatus(p, s, i)} className={`p-3 rounded-xl text-[9px] font-black uppercase border-2 transition-all ${p.status === s ? 'bg-red-500 border-red-500 text-white shadow-lg' : 'border-slate-100 text-slate-400'}`}>{s}</button>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </>
                                ) : (
                                    <div className="card-glass p-8 text-center space-y-4">
                                        <div className="w-14 h-14 rounded-2xl bg-red-50 text-red-500 flex items-center justify-center mx-auto">
                                            <Icons.Menu size={22} />
                                        </div>
                                        <div>
                                            <h2 className="text-xl font-black uppercase tracking-tight">Asignaciones protegidas</h2>
                                            <p className="text-[10px] font-bold text-slate-400 uppercase mt-2 leading-relaxed">Abre el menú hamburguesa y selecciona Mis Asignaciones para validar la contraseña maestra.</p>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'login' && (
                            <div className="w-full max-w-sm py-20 animate-slide">
                                <div className="card-glass p-10 space-y-8">
                                    <h2 className="text-center text-xl font-black uppercase tracking-widest">Panel Staff</h2>
                                    <form onSubmit={handleLogin} className="space-y-4">
                                        <input required className="input-field" placeholder="CORREO ELECTRÓNICO" type="email" value={loginForm.email} onChange={e => setLoginForm({...loginForm, email: e.target.value})} />
                                        <input required type="password" className="input-field" placeholder="CONTRASEÑA" value={loginForm.p} onChange={e => setLoginForm({...loginForm, p: e.target.value})} />
                                        <button type="submit" className="w-full btn-primary h-12">Entrar</button>
                                        <button type="button" onClick={openRegisterUserModal} className="w-full btn-primary h-12">Registrar Usuario</button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </main>

                    {showAssignmentsPasswordModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-6">
                            <div className="card-glass max-w-sm w-full p-10 animate-slide">
                                <h2 className="text-sm font-black text-center uppercase mb-2">Acceso Protegido</h2>
                                <p className="text-[10px] font-bold text-slate-400 uppercase text-center mb-8 leading-relaxed">Ingresa la contraseña maestra del administrador central para abrir Mis Asignaciones. Al validarse, solo se guarda la autorización del usuario; la contraseña no se almacena.</p>
                                <form onSubmit={validateAssignmentsPassword} className="space-y-4">
                                    <input required autoFocus type="password" className="input-field" placeholder="CONTRASEÑA MAESTRA" value={assignmentsPassword} onChange={e => { setAssignmentsPassword(e.target.value); setAssignmentsPasswordError(''); }} />
                                    {assignmentsPasswordError && <p className="text-center text-[10px] font-black text-red-500 uppercase tracking-widest">{assignmentsPasswordError}</p>}
                                    <button disabled={assignmentsUnlocking} type="submit" className="w-full btn-primary h-12 disabled:opacity-50 disabled:cursor-not-allowed">{assignmentsUnlocking ? 'Validando...' : 'Validar acceso'}</button>
                                    <button disabled={assignmentsUnlocking} type="button" onClick={closeAssignmentsPasswordModal} className="w-full text-[9px] font-black text-slate-400 uppercase disabled:opacity-50">Cancelar</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {showUserModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 sm:p-6">
                            <div className="card-glass max-w-sm w-full p-6 sm:p-10 animate-slide max-h-[90vh] overflow-y-auto">
                                <h2 className="text-sm font-black text-center uppercase mb-8">{editingRegisteredUserId ? 'Editar Usuario' : 'Nuevo Usuario'}</h2>
                                <form onSubmit={registerUser} className="space-y-4">
                                    <input required className="input-field" placeholder="NOMBRE COMPLETO" value={userForm.n} onChange={e => setUserForm({...userForm, n: e.target.value})} />
                                    <input required type="email" readOnly={Boolean(editingRegisteredUserId)} className={`input-field ${editingRegisteredUserId ? 'opacity-70 cursor-not-allowed' : ''}`} placeholder="CORREO ELECTRÓNICO" value={userForm.email} onChange={e => setUserForm({...userForm, email: e.target.value})} />
                                    {editingRegisteredUserId && <p className="text-[9px] font-bold text-slate-400 uppercase leading-relaxed">El correo pertenece al acceso de Firebase Auth y no se modifica desde esta edición.</p>}
                                    <input required type="tel" className="input-field" placeholder="NÚMERO DE TELÉFONO" value={userForm.phone} onChange={e => setUserForm({...userForm, phone: e.target.value})} />
                                    {!editingRegisteredUserId && <input required type="password" minLength="6" className="input-field" placeholder="CONTRASEÑA" value={userForm.p} onChange={e => setUserForm({...userForm, p: e.target.value})} />}
                                    <button type="submit" className="w-full btn-primary h-12">{editingRegisteredUserId ? 'Guardar Cambios' : 'Guardar Usuario'}</button>
                                    <button type="button" onClick={closeRegisteredUserModal} className="w-full text-[9px] font-black text-slate-400 uppercase">Cancelar</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
