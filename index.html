                                            </div>
                                            <table className="w-full text-left">
                                                <tbody className="divide-y divide-slate-50">
                                                    {pkgs.map(p => (
                                                        <tr key={p.id} className="text-[10px] font-bold text-slate-600">
                                                            <td className="px-6 py-4 text-red-600 font-black">#{p.id}</td>
                                                            <td className="px-6 py-4">{p.o} → {p.d}<br/><span className="text-[8px] text-slate-400 uppercase">{findProductByTracking(p)?.name || p.productId || 'Sin producto'}</span></td>
                                                            <td className="px-6 py-4"><span className="px-2 py-1 bg-slate-100 rounded-full text-[8px] uppercase">{p.status}</span></td>
                                                            <td className="px-6 py-4 text-right"><button onClick={() => deletePkg(p.id)} className="text-slate-300 hover:text-red-500"><Icons.Trash /></button></td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>

                                        <div className="card-glass overflow-hidden">
                                            <div className="bg-slate-50 border-b border-slate-100 px-6 py-4">
                                                <h2 className="text-[10px] font-black uppercase tracking-widest text-slate-400">Configuración de Correo</h2>
                                                <p className="text-[9px] font-bold text-slate-300 uppercase mt-1">Gmail para notificaciones automáticas de pedidos</p>
                                            </div>
                                            <form onSubmit={saveEmailSettings} className="p-6 grid md:grid-cols-3 gap-3">
                                                <div>
                                                    <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Correo electrónico remitente</label>
                                                    <input required type="email" className="input-field" placeholder="correo@gmail.com" value={emailSettings.senderEmail} onChange={e => setEmailSettings({...emailSettings, senderEmail: e.target.value})} />
                                                </div>
                                                <div>
                                                    <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Contraseña de aplicación Gmail</label>
                                                    <input required type="password" autoComplete="new-password" className="input-field" placeholder="Contraseña de aplicación" value={emailSettings.appPassword} onChange={e => setEmailSettings({...emailSettings, appPassword: e.target.value})} />
                                                </div>
                                                <div>
                                                    <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Correo base receptor</label>
                                                    <input required type="email" className="input-field" placeholder="pedidos@empresa.com" value={emailSettings.receiverEmail} onChange={e => setEmailSettings({...emailSettings, receiverEmail: e.target.value})} />
                                                </div>
                                                <button disabled={emailSaving} type="submit" className="md:col-span-3 btn-primary h-12 disabled:opacity-50 disabled:cursor-not-allowed">{emailSaving ? 'Guardando...' : 'Guardar Configuración de Correo'}</button>
                                            </form>
                                        </div>


                                        <div className="card-glass overflow-hidden">
                                            <div className="bg-slate-50 border-b border-slate-100 px-6 py-4">
                                                <h2 className="text-[10px] font-black uppercase tracking-widest text-slate-400">Configuración de Pagos</h2>
                                                <p className="text-[9px] font-bold text-slate-300 uppercase mt-1">Cuenta Banco Azteca y claves de PayPal para copiar y pegar</p>
                                            </div>
                                            <form onSubmit={savePaymentSettings} className="p-6 grid md:grid-cols-3 gap-3">
                                                <div>
                                                    <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Número de cuenta bancaria</label>
                                                    <input required type="text" className="input-field" placeholder="Cuenta Banco Azteca" value={paymentSettings.bankAccount} onChange={e => setPaymentSettings({...paymentSettings, bankAccount: e.target.value})} />
                                                </div>
                                                <div>
                                                    <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">PayPal Client ID</label>
                                                    <input type="text" className="input-field" placeholder="Pegar Client ID" value={paymentSettings.paypalClientId} onChange={e => setPaymentSettings({...paymentSettings, paypalClientId: e.target.value})} />

                                                    <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">PayPal Secret</label>
                                                    <input type="password" autoComplete="new-password" className="input-field" placeholder="Pegar Secret" value={paymentSettings.paypalClientSecret} onChange={e => setPaymentSettings({...paymentSettings, paypalClientSecret: e.target.value})} />
                                                </div>
                                                <button disabled={paymentSaving} type="submit" className="md:col-span-3 btn-primary h-12 disabled:opacity-50 disabled:cursor-not-allowed">{paymentSaving ? 'Guardando...' : 'Guardar Configuración de Pagos'}</button>
                                            </form>
                                        </div>

                                        <div className="card-glass overflow-hidden">
                                            <div className="bg-slate-50 border-b border-slate-100 px-6 py-4">

                                                            <th className="px-6 py-3">Estado</th>
                                                            <th className="px-6 py-3">Datos del pedido</th>

                                                            <th className="px-6 py-3 text-right">Acción</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-50">

                                                                <td className="px-6 py-4">{t.createdAt ? new Date(t.createdAt).toLocaleString('es-MX') : '-'}</td>

                                                                    <p className="font-black">{t.order?.product?.name}</p>
                                                                    <p className="text-slate-400 font-mono">ID: {t.order?.product?.id}</p>
                                                                    <p className="text-red-600 font-black">${Number(t.order?.product?.price || 0).toFixed(2)}</p>
                                                                    <p className="text-slate-400">{t.order?.delivery?.phone} · {t.order?.delivery?.email}</p>
                                                                </td>
                                                                <td className="px-6 py-4 min-w-[210px]">
                                                                    <div className="space-y-2">
                                                                        <input className="input-field uppercase text-[10px]" placeholder="NÚMERO DE GUÍA" value={transferTrackingDrafts[t.id || t.transferId] ?? t.trackingNumber ?? ''} onChange={e => setTransferTrackingDrafts(prev => ({ ...prev, [t.id || t.transferId]: e.target.value }))} />
                                                                        <button type="button" onClick={() => assignTrackingToTransfer(t)} className="px-3 py-2 bg-red-50 text-red-600 rounded-xl text-[8px] font-black uppercase">Guardar guía</button>
                                                                        {t.trackingNumber && <p className="text-[8px] font-black text-green-600 uppercase">Guía asociada: {t.trackingNumber}</p>}
                                                                    </div>
                                                                </td>
                                                                <td className="px-6 py-4 text-right">
                                                                    {sessionUser?.role === 'admin' && t.status === 'Pendiente' && (
                                                                        <button onClick={() => markTransferPaid(t)} disabled={orderSending} className="px-3 py-2 bg-green-50 text-green-600 rounded-xl text-[8px] font-black uppercase disabled:opacity-50">Pagado</button>
                                                                    )}
                                                                </td>
                                                            </tr>
                                                        ))}
                                                        {pendingTransfers.length === 0 && (
                                                            <tr><td colSpan="6" className="px-6 py-8 text-center text-[10px] font-bold text-slate-300 uppercase">No hay transferencias pendientes registradas</td></tr>
                                                        )}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>

                                        <div className="card-glass overflow-hidden">

                                                </div>

                                            </div>
                                            <div className="p-6 border-b border-slate-50">
                                                <form onSubmit={handleProductSubmit} className="grid md:grid-cols-5 gap-3">
                                                    <label className="md:col-span-5 bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl p-4 cursor-pointer hover:border-red-200 transition-all">

                                                        <div className="flex items-center justify-between gap-4 flex-wrap">
                                                            <div>
                                                                <p className="text-[10px] font-black uppercase text-slate-600">Fotografías del producto</p>

                                                            </div>
                                                            <span className="px-3 py-2 bg-white rounded-xl text-[9px] font-black text-slate-400 uppercase">{(productForm.images || []).length + productImageFiles.length}/5 fotos</span>

                                                    </label>

                                                    {((productForm.images || []).length > 0 || productImageFiles.length > 0) && (

                                                                        <label className="flex-1 text-center bg-white/90 rounded-lg px-2 py-1 text-[7px] font-black uppercase cursor-pointer">

                                                                </div>

                                                                </div>
                                                            ))}
                                                        </div>

                                                    <input required className="input-field md:col-span-2" placeholder="NOMBRE" value={productForm.name} onChange={e => setProductForm({...productForm, name: e.target.value})} />

                                                        <input type="checkbox" checked={productForm.active} onChange={e => setProductForm({...productForm, active: e.target.checked})} />
                                                        Activo
                                                    </label>
                                                    <textarea className="input-field md:col-span-5 min-h-[90px] resize-y" placeholder="DESCRIPCIÓN" value={productForm.description} onChange={e => setProductForm({...productForm, description: e.target.value})}></textarea>
                                                    <textarea className="input-field md:col-span-5 min-h-[90px] resize-y" placeholder="ESPECIFICACIONES" value={productForm.specifications} onChange={e => setProductForm({...productForm, specifications: e.target.value})}></textarea>
                                                    <button disabled={productUploading} type="submit" className="md:col-span-5 btn-primary h-12 disabled:opacity-50 disabled:cursor-not-allowed">{productUploading ? 'Guardando...' : (editingProductId ? 'Guardar Cambios' : 'Agregar Producto')}</button>
                                                </form>
                                            </div>
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-left">
                                                    <thead className="bg-white border-b border-slate-50">
                                                        <tr className="text-[8px] font-black uppercase text-slate-400">
                                                            <th className="px-6 py-3">Foto</th>
                                                            <th className="px-6 py-3">Producto</th>
                                                            <th className="px-6 py-3">Precio</th>
                                                            <th className="px-6 py-3">Inventario</th>
                                                            <th className="px-6 py-3">Estado</th>
                                                            <th className="px-6 py-3 text-right">Acciones</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-50">
                                                        {products.map(product => (
                                                            <tr key={product.id} className="text-[10px] font-bold text-slate-600">
                                                                <td className="px-6 py-4">
                                                                    <div className="w-12 h-12 rounded-xl bg-slate-100 overflow-hidden">
                                                                        {getProductGallery(product)[0] ? <img src={getProductGallery(product)[0]} alt={product.name} className="w-full h-full object-cover" /> : null}
                                                                    </div>
                                                                </td>
                                                                <td className="px-6 py-4"><p className="font-black text-slate-800">{product.name}</p><p className="font-mono text-[8px] text-slate-400">{product.id}</p></td>
                                                                <td className="px-6 py-4 text-red-600 font-black">${Number(product.price || 0).toFixed(2)}</td>
                                                                <td className="px-6 py-4">{Number(product.stock || 0)}</td>
                                                                <td className="px-6 py-4"><span className={`px-2 py-1 rounded-full text-[8px] uppercase ${product.active !== false ? 'bg-green-50 text-green-600' : 'bg-slate-100 text-slate-400'}`}>{product.active !== false ? 'Activo' : 'Inactivo'}</span></td>
                                                                <td className="px-6 py-4 text-right">
                                                                    <div className="flex justify-end gap-2 flex-wrap">
                                                                        <button onClick={() => editProduct(product)} className="px-2 py-1 bg-slate-100 rounded-lg text-[8px] font-black uppercase">Editar</button>
                                                                        <button onClick={() => toggleProduct(product)} className="px-2 py-1 bg-slate-100 rounded-lg text-[8px] font-black uppercase">{product.active !== false ? 'Desactivar' : 'Activar'}</button>
                                                                        <button onClick={() => deleteProduct(product.id)} className="text-slate-300 hover:text-red-500"><Icons.Trash /></button>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                        {products.length === 0 && (
                                                            <tr><td colSpan="6" className="px-6 py-8 text-center text-[10px] font-bold text-slate-300 uppercase">Aún no hay productos registrados</td></tr>
                                                        )}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>

                                        <div className="card-glass overflow-hidden">
                                            <div className="bg-slate-50 border-b border-slate-100 px-6 py-4 flex items-center justify-between gap-3">
                                                <div>
                                                    <h2 className="text-[10px] font-black uppercase tracking-widest text-slate-400">Conductores Registrados</h2>
                                                    <p className="text-[9px] font-bold text-slate-300 uppercase mt-1">Registro y control de accesos para rutas</p>
                                                </div>
                                                <button onClick={() => setShowStaffModal(true)} className="px-3 py-2 bg-red-50 text-red-600 rounded-xl text-[8px] font-black uppercase">Registrar Conductor</button>
                                            </div>
                                            <table className="w-full text-left">
                                                <thead className="bg-white border-b border-slate-50">
                                                    <tr className="text-[8px] font-black uppercase text-slate-400">
                                                        <th className="px-6 py-3">Nombre</th>
                                                        <th className="px-6 py-3">Correo electrónico</th>
                                                        <th className="px-6 py-3 text-right">Acción</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-50">
                                                    {ops.filter(o => o.role === 'operador').map(o => (
                                                        <tr key={o.id} className="text-[10px] font-bold text-slate-600">
                                                            <td className="px-6 py-4">{o.name}</td>
                                                            <td className="px-6 py-4 font-mono text-slate-400">{o.email}</td>
                                                            <td className="px-6 py-4 text-right"><button onClick={() => deleteOp(o.id)} className="text-slate-300 hover:text-red-500"><Icons.Trash /></button></td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}


                        {view === 'admin-tracking' && (
                            <div className="w-full max-w-4xl py-6 space-y-6 animate-slide">
                                <button onClick={() => setView('admin')} className="mb-2 text-[10px] font-black uppercase text-slate-400 hover:text-red-500">← Volver al Panel de Control</button>
                                <div className="card-glass p-6 space-y-5">
                                    <div className="text-center">
                                        <p className="text-[10px] text-red-500 font-black uppercase tracking-widest">Panel de Control</p>
                                        <h1 className="text-3xl font-black tracking-tight">Buscador de Guías</h1>
                                        <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">Módulo independiente, fuera de Nuevo Envío</p>
                                    </div>
                                    <div className="bg-slate-50 p-2 rounded-2xl border-2 border-slate-100 flex gap-2 max-w-xl mx-auto">
                                        <input className="flex-grow bg-transparent px-4 text-sm font-bold uppercase outline-none" placeholder="INGRESE NÚMERO DE GUÍA" value={searchQuery} onChange={e => runTrackingSearch(e.target.value, false)} />
                                        <button onClick={() => runTrackingSearch(searchQuery, true)} className="btn-primary">Buscar</button>
                                    </div>
                                    {trackingNotFound && <p className="text-center text-[10px] font-black text-red-500 uppercase tracking-widest">No se encontró el envío</p>}
                                    {!trackingResult && !trackingNotFound && <p className="text-center text-[10px] font-black text-slate-300 uppercase tracking-widest">Ingresa una guía para consultar el producto asociado</p>}
                                    {trackingResult && (() => {
                                        const trackedProduct = findProductByTracking(trackingResult);
                                        const trackedImage = getProductGallery(trackedProduct)[0] || '';
                                        return (
                                            <div className="card-glass p-6 max-w-3xl mx-auto animate-slide">
                                                <div className="flex flex-col sm:flex-row gap-5">
                                                    <div className="w-full sm:w-44 h-44 rounded-2xl bg-slate-100 overflow-hidden shrink-0">
                                                        {trackedImage ? <img src={trackedImage} alt={trackedProduct?.name || 'Producto'} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-[10px] font-black text-slate-300 uppercase">Sin foto</div>}
                                                    </div>
                                                    <div className="flex-grow space-y-4">
                                                        <div className="flex items-start justify-between gap-4">
                                                            <div>
                                                                <p className="text-[9px] font-black text-slate-400 uppercase mb-1">Número de guía</p>
                                                                <h2 className="text-3xl font-black text-red-600">#{trackingResult.id}</h2>
                                                            </div>
                                                            <div className="text-right">
                                                                <p className="text-[9px] font-black text-slate-400 uppercase mb-1">Estado del envío</p>
                                                                <p className="px-3 py-1 bg-red-50 text-red-600 rounded-full text-[10px] font-black uppercase">{trackingResult.status || 'Recolectado'}</p>
                                                            </div>
                                                        </div>
                                                        <div className="bg-slate-50 rounded-2xl p-4 grid sm:grid-cols-2 gap-4">
                                                            <div><p className="text-[8px] font-black text-slate-400 uppercase">Producto</p><p className="text-sm font-black text-slate-900">{trackedProduct?.name || 'Producto no asociado'}</p></div>
                                                            <div><p className="text-[8px] font-black text-slate-400 uppercase">ID del producto</p><p className="text-sm font-mono font-black text-slate-700">{trackedProduct?.id || trackingResult.productId || '-'}</p></div>
                                                            <div><p className="text-[8px] font-black text-slate-400 uppercase">Origen</p><p className="text-[11px] font-bold uppercase">{trackingResult.o || '-'}</p></div>
                                                            <div><p className="text-[8px] font-black text-slate-400 uppercase">Destino</p><p className="text-[11px] font-bold uppercase">{trackingResult.d || '-'}</p></div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })()}
                                </div>
                            </div>
                        )}

                        {(view === 'support' || view === 'admin-support') && (
                            <div className="w-full max-w-5xl py-8 animate-slide">
                                <button onClick={() => setView(view === 'admin-support' ? 'admin' : 'home')} className="mb-5 text-[10px] font-black uppercase text-slate-400 hover:text-red-500">← Volver</button>
                                <div className="card-glass overflow-hidden grid md:grid-cols-[280px_1fr] min-h-[620px]">
                                    {view === 'admin-support' && (
                                        <aside className="border-r border-slate-100 bg-slate-50 p-4 space-y-3">
                                            <h2 className="text-[10px] font-black uppercase tracking-widest text-slate-400">Chats de soporte</h2>
                                            <div className="space-y-2 max-h-[540px] overflow-y-auto pr-1">
                                                {supportChats.map(chat => (
                                                    <button key={chat.id || chat.chatId} onClick={() => setActiveSupportChatId(chat.id || chat.chatId)} className={`w-full text-left p-3 rounded-2xl border text-[10px] font-bold ${((chat.id || chat.chatId) === activeSupportChatId) ? 'bg-white border-red-200' : 'bg-white/70 border-slate-100'}`}>
                                                        <p className="font-black text-slate-800 truncate">{chat.userEmail || chat.userId}</p>
                                                        <p className={`mt-1 uppercase text-[8px] font-black ${chat.status === 'closed' ? 'text-slate-300' : 'text-green-600'}`}>{chat.status === 'closed' ? 'Cerrado' : 'Activo'}</p>
                                                    </button>
                                                ))}
                                                {supportChats.length === 0 && <p className="text-[10px] font-bold text-slate-300 uppercase text-center py-8">Sin chats todavía</p>}
                                            </div>
                                        </aside>
                                    )}
                                    <section className={`${view === 'admin-support' ? '' : 'md:col-span-2'} flex flex-col bg-white`}>
                                        <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between gap-3">
                                            <div>
                                                <p className="text-[10px] text-red-500 font-black uppercase tracking-widest">Soporte Técnico</p>
                                                <h1 className="text-2xl font-black tracking-tight">Chat interno</h1>
                                            </div>
                                            {view === 'admin-support' && adminSelectedSupportChat?.status !== 'closed' && (
                                                <button onClick={() => closeSupportChat(adminSelectedSupportChat)} className="px-3 py-2 bg-green-50 text-green-600 rounded-xl text-[8px] font-black uppercase">Solucionado</button>
                                            )}
                                        </div>
                                        <div className="flex-1 p-5 bg-slate-50 overflow-y-auto space-y-3 max-h-[460px]">
                                            {((view === 'admin-support' ? adminSelectedSupportChat : activeSupportChat)?.messages || []).map(msg => (
                                                <div key={msg.id} className={`flex ${msg.sender === 'admin' ? 'justify-end' : 'justify-start'}`}>
                                                    <div className={`max-w-[78%] rounded-2xl px-4 py-3 text-sm font-semibold ${msg.sender === 'admin' ? 'bg-red-500 text-white rounded-br-sm' : 'bg-white text-slate-700 rounded-bl-sm border border-slate-100'}`}>
                                                        <p>{msg.text}</p>
                                                        <p className={`text-[8px] font-black uppercase mt-2 ${msg.sender === 'admin' ? 'text-red-100' : 'text-slate-300'}`}>{msg.senderName} · {msg.createdAt ? new Date(msg.createdAt).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }) : ''}</p>
                                                    </div>
                                                </div>
                                            ))}
                                            {(((view === 'admin-support' ? adminSelectedSupportChat : activeSupportChat)?.messages || []).length === 0) && (
                                                <div className="h-full flex items-center justify-center text-center text-[10px] font-black text-slate-300 uppercase tracking-widest">Escribe un mensaje para iniciar soporte</div>
                                            )}
                                            {(view === 'admin-support' ? adminSelectedSupportChat : activeSupportChat)?.status === 'closed' && (
                                                <p className="text-center text-[10px] font-black text-slate-400 uppercase">Conversación cerrada</p>
                                            )}
                                        </div>
                                        <div className="p-4 border-t border-slate-100 flex gap-2">
                                            <input disabled={(view === 'admin-support' ? adminSelectedSupportChat : activeSupportChat)?.status === 'closed'} className="input-field" placeholder="Escribe tu mensaje..." value={supportInput} onChange={e => setSupportInput(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') sendSupportMessage(view === 'admin-support' ? 'admin' : 'user'); }} />
                                            <button disabled={(view === 'admin-support' ? adminSelectedSupportChat : activeSupportChat)?.status === 'closed'} onClick={() => sendSupportMessage(view === 'admin-support' ? 'admin' : 'user')} className="btn-primary disabled:opacity-50"><Icons.Send /> Enviar</button>
                                        </div>
                                    </section>
                                </div>
                            </div>
                        )}

                        {view === 'operator' && (
                            <div className="w-full max-w-xl space-y-8 animate-slide">
                                <div><h1 className="text-3xl font-black uppercase tracking-tight">Mis <span className="text-red-500">Asignaciones</span></h1><p className="text-[10px] font-bold text-slate-400 uppercase">Ruta Activa</p></div>
                                <div className="space-y-4">
                                    {pkgs.filter(p => p.op === sessionUser.id).map(p => (
                                        <div key={p.id} className="card-glass p-6 space-y-6">
                                            <div className="flex justify-between items-center"><h3 className="text-xl font-black text-red-600">#{p.id}</h3><span className="text-[9px] font-black uppercase text-slate-400">{p.o} → {p.d}</span></div>
                                            <div className="grid grid-cols-2 gap-2">
                                                {STEPS.map((s, i) => (
                                                    <button key={s} onClick={() => saveDoc('packages', p.id, { ...p, status: s, currentStep: i })} className={`p-3 rounded-xl text-[9px] font-black uppercase border-2 transition-all ${p.status === s ? 'bg-red-500 border-red-500 text-white shadow-lg' : 'border-slate-100 text-slate-400'}`}>{s}</button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'login' && (
                            <div className="w-full max-w-sm py-20 animate-slide">
                                <div className="card-glass p-10 space-y-8">
                                    <h2 className="text-center text-xl font-black uppercase tracking-widest">Panel Staff</h2>
                                    <form onSubmit={handleLogin} className="space-y-4">
                                        <input required className="input-field" placeholder="CORREO ELECTRÓNICO" type="email" value={loginForm.email} onChange={e => setLoginForm({...loginForm, email: e.target.value})} />
                                        <input required type="password" className="input-field" placeholder="CONTRASEÑA" value={loginForm.p} onChange={e => setLoginForm({...loginForm, p: e.target.value})} />
                                        <button type="submit" className="w-full btn-primary h-12">Entrar</button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </main>

                    {showStaffModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-6">
                            <div className="card-glass max-w-sm w-full p-10 animate-slide">
                                <h2 className="text-sm font-black text-center uppercase mb-8">Nuevo Conductor</h2>
                                <form onSubmit={registerDriver} className="space-y-4">
                                    <input required className="input-field" placeholder="NOMBRE COMPLETO" value={staffForm.n} onChange={e => setStaffForm({...staffForm, n: e.target.value})} />
                                    <input required type="email" className="input-field" placeholder="CORREO ELECTRÓNICO" value={staffForm.email} onChange={e => setStaffForm({...staffForm, email: e.target.value})} />
                                    <input required type="password" minLength="6" className="input-field" placeholder="CONTRASEÑA" value={staffForm.p} onChange={e => setStaffForm({...staffForm, p: e.target.value})} />
                                    <button type="submit" className="w-full btn-primary h-12">Guardar Conductor</button>
                                    <button type="button" onClick={() => { setStaffForm({ email: '', p: '', n: '' }); setShowStaffModal(false); }} className="w-full text-[9px] font-black text-slate-400 uppercase">Cancelar</button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
