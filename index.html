<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive MX - Logística</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .btn-primary { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; font-size: 0.75rem; background: #ef4444; color: white; border-radius: 0.75rem; padding: 0.75rem 1.5rem; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.3); background: #dc2626; }
        .card-glass { background: white; border: 1px solid #e2e8f0; border-radius: 1.5rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); }
        .input-field { font-size: 0.85rem; background: #f1f5f9; border-radius: 0.75rem; padding: 0.85rem 1rem; width: 100%; border: 2px solid transparent; transition: all 0.2s; font-weight: 600; }
        .input-field:focus { background: white; border-color: #ef4444; outline: none; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide { animation: slideUp 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, onSnapshot, deleteDoc, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDOK0wHv1gV5_wB4OSbYjDcL9lmLEg_Rdo",
            authDomain: "drivemx-paqueteria.firebaseapp.com",
            projectId: "drivemx-paqueteria",
            storageBucket: "drivemx-paqueteria.firebasestorage.app",
            messagingSenderId: "486434579543",
            appId: "1:486434579543:web:8fe53f54b1446644236f12",
            measurementId: "G-QDWX6CHWRM"
        };

        window.firebaseConfig = firebaseConfig;
        window.FirebaseSDK = { initializeApp, getAuth, onAuthStateChanged, signInAnonymously, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, getFirestore, doc, getDoc, setDoc, collection, onSnapshot, deleteDoc, query, getStorage, ref, uploadBytes, getDownloadURL };
    </script>

    <script type="text/babel" data-presets="react">
        const { useState, useEffect } = React;
        const fbase = window.FirebaseSDK;
        
        const Icons = {
            Truck: ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-5l-4-4h-3v10h3Z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>,
            Trash: ({size=14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
            LogOut: ({size=14}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>,
            ChevronLeft: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>,
            ChevronRight: ({size=18}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>,
            Menu: ({size=20}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>,
            Send: ({size=16}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        };

        const STEPS = ['Recolectado', 'Procesando', 'En Camino', 'Entregado'];
        const appId = window.firebaseConfig.projectId;
        const ADMIN_EMAIL = 'admin@drivemx.com';
        const readLocal = (key) => { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) { return []; } };
        const writeLocal = (key, data) => { try { localStorage.setItem(key, JSON.stringify(data)); } catch(e) {} };
        const getProductGallery = (product) => {
            const legacyImage = product?.imageUrl || product?.image || '';
            const gallery = Array.isArray(product?.images) ? product.images.filter(Boolean) : [];
            if (gallery.length > 0) return gallery.slice(0, 5);
            return legacyImage ? [legacyImage] : [];
        };

        const App = () => {
            const [view, setView] = useState('home');
            const [fbUser, setFbUser] = useState(null);
            const [sessionUser, setSessionUser] = useState(null);
            const [pkgs, setPkgs] = useState(() => readLocal('driveMxPackages'));
            const [ops, setOps] = useState(() => readLocal('driveMxOperators'));
            const [products, setProducts] = useState(() => readLocal('driveMxProducts'));
            const [searchQuery, setSearchQuery] = useState('');
            const [trackingResult, setTrackingResult] = useState(null);
            const [trackingNotFound, setTrackingNotFound] = useState(false);
            const [loginForm, setLoginForm] = useState({ email: '', p: '' });
            const [pkgForm, setPkgForm] = useState({ id: '', o: '', d: '', op: '', productId: '' });
            const [staffForm, setStaffForm] = useState({ email: '', p: '', n: '' });
            const [productForm, setProductForm] = useState({ id: '', name: '', price: '', stock: '', description: '', specifications: '', images: [], image: '', imageUrl: '', active: true });
            const [productImageFiles, setProductImageFiles] = useState([]);
            const [productUploading, setProductUploading] = useState(false);
            const [editingProductId, setEditingProductId] = useState(null);
            const [selectedProductId, setSelectedProductId] = useState(null);
            const [currentImageIndex, setCurrentImageIndex] = useState(0);
            const [deliveryForm, setDeliveryForm] = useState({ street: '', state: '', municipality: '', neighborhood: '', zip: '', fullName: '', phone: '', email: '', references: '' });
            const [emailSettings, setEmailSettings] = useState(() => { try { return JSON.parse(localStorage.getItem('driveMxEmailSettings') || '{\"senderEmail\":\"\",\"appPassword\":\"\",\"receiverEmail\":\"\"}'); } catch(e) { return { senderEmail: '', appPassword: '', receiverEmail: '' }; } });
            const [paymentSettings, setPaymentSettings] = useState(() => { try { return JSON.parse(localStorage.getItem('driveMxPaymentSettings') || '{\"bankAccount\":\"\",\"paypalClientId\":\"\",\"paypalClientSecret\":\"\"}'); } catch(e) { return { bankAccount: '', paypalClientId: '', paypalClientSecret: '' }; } });
            const [pendingTransfers, setPendingTransfers] = useState(() => readLocal('driveMxPendingTransfers'));
            const [transferTrackingDrafts, setTransferTrackingDrafts] = useState({});
            const [emailSaving, setEmailSaving] = useState(false);
            const [paymentSaving, setPaymentSaving] = useState(false);
            const [orderSending, setOrderSending] = useState(false);
            const [selectedPaymentMethod, setSelectedPaymentMethod] = useState('paypal');
            const [showStaffModal, setShowStaffModal] = useState(false);
            const [supportChats, setSupportChats] = useState(() => readLocal('driveMxSupportChats'));
            const [supportInput, setSupportInput] = useState('');
            const [activeSupportChatId, setActiveSupportChatId] = useState('');
            const [showAdminMenu, setShowAdminMenu] = useState(false);

            useEffect(() => {
                const app = fbase.initializeApp(window.firebaseConfig);
                const auth = fbase.getAuth(app);
                fbase.signInAnonymously(auth).catch((err) => { console.error('Firebase Auth:', err); setFbUser({ uid: 'local' }); });
                return fbase.onAuthStateChanged(auth, (user) => setFbUser(user || { uid: 'local' }));
            }, []);

            useEffect(() => {
                if (!fbUser) return;
                const db = fbase.getFirestore();
                const pkgCol = fbase.collection(db, 'artifacts', appId, 'public', 'data', 'packages');
                const opCol = fbase.collection(db, 'artifacts', appId, 'public', 'data', 'operators');
                const productCol = fbase.collection(db, 'artifacts', appId, 'public', 'data', 'products');
                const transferCol = fbase.collection(db, 'artifacts', appId, 'public', 'data', 'bank_transfers');
                const supportCol = fbase.collection(db, 'artifacts', appId, 'public', 'data', 'support_chats');
                const mailSettingsRef = fbase.doc(db, 'artifacts', appId, 'public', 'data', 'mail_settings', 'config');
                const paymentSettingsRef = fbase.doc(db, 'artifacts', appId, 'public', 'data', 'payment_settings', 'config');
                
                const unsubPkgs = fbase.onSnapshot(pkgCol, (s) => {
                    const l = []; s.forEach(d => l.push(d.data()));
                    setPkgs(l);
                    writeLocal('driveMxPackages', l);
                }, (err) => { console.error('Firestore paquetes:', err); });

                const unsubOps = fbase.onSnapshot(opCol, (s) => {
                    const l = []; s.forEach(d => l.push({ id: d.id, ...d.data() }));
                    setOps(l);
                    writeLocal('driveMxOperators', l);
                }, (err) => { console.error('Firestore operadores:', err); });

                const unsubProducts = fbase.onSnapshot(productCol, (s) => {
                    const l = []; s.forEach(d => l.push(d.data()));
                    setProducts(l);
                    writeLocal('driveMxProducts', l);
                }, (err) => { console.error('Firestore productos:', err); });

                const unsubTransfers = fbase.onSnapshot(transferCol, (s) => {
                    const l = []; s.forEach(d => l.push({ id: d.id, ...d.data() }));
                    l.sort((a, b) => Number(b.createdAt || 0) - Number(a.createdAt || 0));
                    setPendingTransfers(l);
                    writeLocal('driveMxPendingTransfers', l);
                }, (err) => { console.error('Firestore transferencias:', err); });

                const unsubMailSettings = fbase.onSnapshot(mailSettingsRef, (snap) => {
                    if (!snap.exists()) return;
                    const data = snap.data() || {};
                    const next = {
                        senderEmail: data.senderEmail || '',
                        appPassword: data.appPassword || '',
                        receiverEmail: data.receiverEmail || ''
                    };
                    setEmailSettings(next);
                    try { localStorage.setItem('driveMxEmailSettings', JSON.stringify(next)); } catch(e) {}
                }, (err) => { console.error('Firestore configuración correo:', err); });

                const unsubSupportChats = fbase.onSnapshot(supportCol, (s) => {
                    const l = []; s.forEach(d => l.push({ id: d.id, ...d.data() }));
                    l.sort((a, b) => Number(b.updatedAt || b.createdAt || 0) - Number(a.updatedAt || a.createdAt || 0));
                    setSupportChats(l);
                    writeLocal('driveMxSupportChats', l);
                }, (err) => { console.error('Firestore soporte:', err); });

                const unsubPaymentSettings = fbase.onSnapshot(paymentSettingsRef, (snap) => {
                    if (!snap.exists()) return;
                    const data = snap.data() || {};
                    const next = {
                        bankAccount: data.bankAccount || '',
                        paypalClientId: data.paypalClientId || '',
                        paypalClientSecret: data.paypalClientSecret || ''
                    };
                    setPaymentSettings(next);
                    try { localStorage.setItem('driveMxPaymentSettings', JSON.stringify(next)); } catch(e) {}
                }, (err) => { console.error('Firestore configuración pagos:', err); });

                return () => { unsubPkgs(); unsubOps(); unsubProducts(); unsubTransfers(); unsubSupportChats(); unsubMailSettings(); unsubPaymentSettings(); };
            }, [fbUser]);

            const saveDoc = async (col, id, data) => {
                if (col === 'packages') {
                    setPkgs(prev => { const next = [...prev.filter(x => x.id !== id), data]; writeLocal('driveMxPackages', next); return next; });
                }
                if (col === 'operators') {
                    setOps(prev => { const next = [...prev.filter(x => x.id !== id), { id, ...data }]; writeLocal('driveMxOperators', next); return next; });
                }
                if (col === 'products') {
                    setProducts(prev => { const next = [...prev.filter(x => x.id !== id), data]; writeLocal('driveMxProducts', next); return next; });
                }
                if (col === 'bank_transfers') {
                    setPendingTransfers(prev => { const next = [{ id, ...data }, ...prev.filter(x => x.id !== id)]; writeLocal('driveMxPendingTransfers', next); return next; });
                }
                if (col === 'support_chats') {
                    setSupportChats(prev => { const next = [{ id, ...data }, ...prev.filter(x => x.id !== id)].sort((a, b) => Number(b.updatedAt || b.createdAt || 0) - Number(a.updatedAt || a.createdAt || 0)); writeLocal('driveMxSupportChats', next); return next; });
                }
                try {
                    const db = fbase.getFirestore();
                    await fbase.setDoc(fbase.doc(db, 'artifacts', appId, 'public', 'data', col, id), data);
                } catch(err) {
                    console.error('Firestore guardar:', err);
                }
            };

            const deletePkg = async (id) => {
                setPkgs(prev => { const next = prev.filter(x => x.id !== id); writeLocal('driveMxPackages', next); return next; });
                try {
                    const db = fbase.getFirestore();
                    await fbase.deleteDoc(fbase.doc(db, 'artifacts', appId, 'public', 'data', 'packages', id));
                } catch(err) { console.error('Firestore borrar paquete:', err); }
            };

            const deleteOp = async (id) => {
                setOps(prev => { const next = prev.filter(x => x.id !== id); writeLocal('driveMxOperators', next); return next; });
                try {
                    const db = fbase.getFirestore();
                    await fbase.deleteDoc(fbase.doc(db, 'artifacts', appId, 'public', 'data', 'operators', id));
                } catch(err) { console.error('Firestore borrar conductor:', err); }
            };

            const resetProductForm = () => {
                setProductForm({ id: '', name: '', price: '', stock: '', description: '', specifications: '', images: [], image: '', imageUrl: '', active: true });
                productImageFiles.forEach(item => { try { URL.revokeObjectURL(item.preview); } catch(e) {} });
                setProductImageFiles([]);
                setProductUploading(false);
                setEditingProductId(null);
            };

            const uploadSingleProductImage = async (productId, file) => {
                const storage = fbase.getStorage();
                const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
                const imageRef = fbase.ref(storage, `products/${productId}/${Date.now()}-${safeName}`);
                await fbase.uploadBytes(imageRef, file);
                return await fbase.getDownloadURL(imageRef);
            };

            const handleProductImagesSelect = (e) => {
                const files = Array.from(e.target.files || []).filter(file => file.type.startsWith('image/'));
                if (files.length === 0) return;
                const currentCount = (productForm.images || []).length + productImageFiles.length;
                const availableSlots = Math.max(0, 5 - currentCount);
                if (availableSlots === 0) {
                    alert('Solo puedes guardar hasta 5 fotografías por producto.');
                    e.target.value = '';
                    return;
                }
                const selected = files.slice(0, availableSlots).map(file => ({ file, preview: URL.createObjectURL(file) }));
                if (files.length > availableSlots) alert('Solo se agregaron las fotografías permitidas hasta completar 5.');
                setProductImageFiles(prev => [...prev, ...selected]);
                e.target.value = '';
            };

            const removeExistingProductImage = (index) => {
                setProductForm(prev => ({ ...prev, images: (prev.images || []).filter((_, i) => i !== index) }));
            };

            const removeNewProductImage = (index) => {
                setProductImageFiles(prev => {
                    const item = prev[index];
                    if (item?.preview) { try { URL.revokeObjectURL(item.preview); } catch(e) {} }
                    return prev.filter((_, i) => i !== index);
                });
            };

            const replaceExistingProductImage = async (index, e) => {
                const file = e.target.files?.[0];
                e.target.value = '';
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    alert('Selecciona un archivo de imagen válido.');
                    return;
                }
                const id = editingProductId || productForm.id;
                if (!id) {
                    alert('Guarda primero el producto para poder reemplazar fotografías existentes.');
                    return;
                }
                setProductUploading(true);
                try {
                    const url = await uploadSingleProductImage(id, file);
                    setProductForm(prev => {
                        const images = [...(prev.images || [])];
                        images[index] = url;
                        return { ...prev, images, image: images[0] || '', imageUrl: images[0] || '' };
                    });
                } catch(err) {
                    console.error('Storage reemplazar foto:', err);
                    alert('No se pudo reemplazar la fotografía.');
                } finally {
                    setProductUploading(false);
                }
            };

            const uploadPendingProductImages = async (productId) => {
                const urls = [];
                for (const item of productImageFiles) {
                    urls.push(await uploadSingleProductImage(productId, item.file));
                }
                return urls;
            };

            const handleProductSubmit = async (e) => {
                e.preventDefault();
                const id = editingProductId || productForm.id || `prod_${Date.now()}`;
                setProductUploading(true);
                try {
                    const existing = products.find(p => p.id === id);
                    const oldImages = getProductGallery(existing);
                    const currentImages = Array.isArray(productForm.images) ? productForm.images.filter(Boolean) : oldImages;
                    const uploadedImages = await uploadPendingProductImages(id);
                    const images = [...currentImages, ...uploadedImages].filter(Boolean).slice(0, 5);
                    const mainImage = images[0] || '';
                    const product = {
                        ...(existing || {}),
                        id,
                        name: productForm.name.trim(),
                        price: Number(productForm.price || 0),
                        stock: Number(productForm.stock || 0),
                        description: productForm.description.trim(),
                        specifications: productForm.specifications.trim(),
                        images,
                        image: mainImage,
                        imageUrl: mainImage,
                        active: Boolean(productForm.active),
                        updatedAt: Date.now(),
                        createdAt: existing?.createdAt || Date.now()
                    };
                    await saveDoc('products', id, product);
                    resetProductForm();
                } catch(err) {
                    console.error('Storage producto:', err);
                    alert('No se pudo guardar el producto. Revisa Firebase Storage y vuelve a intentar.');
                    setProductUploading(false);
                }
            };

            const editProduct = (product) => {
                const images = getProductGallery(product);
                setProductForm({
                    id: product.id,
                    name: product.name || '',
                    price: product.price ?? '',
                    stock: product.stock ?? '',
                    description: product.description || '',
                    specifications: product.specifications || '',
                    images,
                    image: images[0] || '',
                    imageUrl: images[0] || '',
                    active: product.active !== false
                });
                productImageFiles.forEach(item => { try { URL.revokeObjectURL(item.preview); } catch(e) {} });
                setProductImageFiles([]);
                setEditingProductId(product.id);
            };


            const toggleProduct = (product) => {
                saveDoc('products', product.id, { ...product, active: product.active === false, updatedAt: Date.now() });
            };

            const deleteProduct = async (id) => {
                setProducts(prev => { const next = prev.filter(x => x.id !== id); writeLocal('driveMxProducts', next); return next; });
                try {
                    const db = fbase.getFirestore();
                    await fbase.deleteDoc(fbase.doc(db, 'artifacts', appId, 'public', 'data', 'products', id));
                } catch(err) { console.error('Firestore borrar producto:', err); }
            };

            const activeProducts = products.filter(p => p.active !== false);
            const selectedProduct = products.find(p => p.id === selectedProductId);
            const selectedGallery = getProductGallery(selectedProduct);
            const selectedMainImage = selectedGallery[currentImageIndex] || '';

            const resetPublicFlow = () => {
                setView('home');
                setSearchQuery('');
                setTrackingResult(null);
                setTrackingNotFound(false);
                setSelectedProductId(null);
                setCurrentImageIndex(0);
                setSelectedPaymentMethod('paypal');
                resetDeliveryForm();
                setOrderSending(false);
            };

            const resetAfterIncompletePayment = () => {
                resetPublicFlow();
                const container = document.getElementById('paypal-buttons-container');
                if (container) container.innerHTML = '';
            };

            useEffect(() => {
                if (view !== 'payment-method' || selectedPaymentMethod !== 'paypal' || !paymentSettings.paypalClientId || !selectedProduct) return;
                if (!emailSettings.senderEmail.trim() || !emailSettings.appPassword.trim() || !emailSettings.receiverEmail.trim()) return;
                const containerId = 'paypal-buttons-container';
                const renderPayPalButtons = () => {
                    const container = document.getElementById(containerId);
                    if (!container || !window.paypal) return;
                    container.innerHTML = '';
                    window.paypal.Buttons({
                        style: { layout: 'vertical', shape: 'rect', label: 'paypal' },
                        createOrder: (data, actions) => actions.order.create({
                            purchase_units: [{
                                description: selectedProduct.name || 'Solicitud Drive MX',
                                amount: {
                                    currency_code: 'MXN',
                                    value: Number(selectedProduct.price || 0).toFixed(2)
                                }
                            }]
                        }),
                        onApprove: async (data, actions) => {
                            setOrderSending(true);
                            try {
                                await actions.order.capture();
                                await sendOrderEmail(buildOrderPayload());
                                alert('Pago PayPal confirmado. La solicitud fue enviada correctamente.');
                                resetPublicFlow();
                            } catch(err) {
                                console.error('Confirmar PayPal:', err);
                                alert(err.message || 'No se pudo procesar el pago PayPal.');
                            } finally {
                                setOrderSending(false);
                            }
                        },
                        onCancel: () => {
                            alert('Pago cancelado. La pantalla se restablecerá al inicio.');
                            resetAfterIncompletePayment();
                        },
                        onError: (err) => {
                            console.error('PayPal:', err);
                            alert('No se pudo completar el pago con PayPal. La pantalla se restablecerá al inicio.');
                            resetAfterIncompletePayment();
                        }
                    }).render(`#${containerId}`);
                };

                const paypalSdkSrc = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(paymentSettings.paypalClientId)}&currency=MXN&intent=capture&commit=true&locale=es_MX`;
                const existing = document.querySelector('script[data-drive-mx-paypal="true"]');
                if (existing && existing.src !== paypalSdkSrc) {
                    existing.remove();
                    window.paypal = undefined;
                }
                const activeScript = document.querySelector('script[data-drive-mx-paypal="true"]');
                if (activeScript && window.paypal) {
                    renderPayPalButtons();
                    return;
                }
                if (activeScript) {
                    activeScript.addEventListener('load', renderPayPalButtons, { once: true });
                    return;
                }
                const script = document.createElement('script');
                script.src = paypalSdkSrc;
                script.dataset.driveMxPaypal = 'true';
                script.onload = renderPayPalButtons;
                script.onerror = () => alert('No se pudo cargar PayPal. Revisa el Client ID configurado.');
                document.body.appendChild(script);
            }, [view, selectedPaymentMethod, paymentSettings.paypalClientId, selectedProductId, emailSettings.senderEmail, emailSettings.appPassword, emailSettings.receiverEmail]);

            const getSecondaryAuth = () => {
                if (!window.secondaryAuthApp) {
                    window.secondaryAuthApp = fbase.initializeApp(window.firebaseConfig, 'SecondaryAuthApp');
                }
                return fbase.getAuth(window.secondaryAuthApp);
            };

            const getStaffProfile = async (user) => {
                const db = fbase.getFirestore();
                const profileRef = fbase.doc(db, 'artifacts', appId, 'public', 'data', 'operators', user.uid);
                const profileSnap = await fbase.getDoc(profileRef);
                if (profileSnap.exists()) return { id: user.uid, uid: user.uid, email: user.email, ...profileSnap.data() };

                if ((user.email || '').toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                    const adminProfile = {
                        uid: user.uid,
                        email: user.email,
                        name: 'Admin Central',
                        role: 'admin',
                        active: true,
                        createdAt: Date.now(),
                        updatedAt: Date.now()
                    };
                    await saveDoc('operators', user.uid, adminProfile);
                    return { id: user.uid, ...adminProfile };
                }

                return null;
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                try {
                    const auth = fbase.getAuth();
                    const credential = await fbase.signInWithEmailAndPassword(auth, loginForm.email.trim(), loginForm.p);
                    const profile = await getStaffProfile(credential.user);
                    if (!profile || profile.active === false) {
                        await fbase.signOut(auth);
                        await fbase.signInAnonymously(auth).catch(() => {});
                        setLoginForm({ email: '', p: '' });
                        alert('Tu cuenta no tiene acceso activo al panel.');
                        return;
                    }
                    setSessionUser(profile);
                    setLoginForm({ email: '', p: '' });
                    setView(profile.role === 'admin' ? 'admin' : 'operator');
                } catch(err) {
                    console.error('Login Firebase Auth:', err);
                    setLoginForm(prev => ({ ...prev, p: '' }));
                    alert('Correo o contraseña incorrectos.');
                }
            };

            const handleLogout = async () => {
                const auth = fbase.getAuth();
                setSessionUser(null);
                setLoginForm({ email: '', p: '' });
                setStaffForm({ email: '', p: '', n: '' });
                setShowStaffModal(false);
                resetPublicFlow();
                try {
                    await fbase.signOut(auth);
                    await fbase.signInAnonymously(auth);
                } catch(err) {
                    console.error('Cerrar sesión:', err);
                }
            };

            const registerDriver = async (e) => {
                e.preventDefault();
                if (!staffForm.email.trim() || !staffForm.p || !staffForm.n.trim()) return;
                try {
                    const secondaryAuth = getSecondaryAuth();
                    const credential = await fbase.createUserWithEmailAndPassword(secondaryAuth, staffForm.email.trim(), staffForm.p);
                    const newOp = {
                        uid: credential.user.uid,
                        email: credential.user.email,
                        name: staffForm.n.trim(),
                        role: 'operador',
                        active: true,
                        createdAt: Date.now(),
                        updatedAt: Date.now()
                    };
                    await saveDoc('operators', credential.user.uid, newOp);
                    await fbase.signOut(secondaryAuth).catch(() => {});
                    setStaffForm({ email: '', p: '', n: '' });
                    setShowStaffModal(false);
                    alert('Conductor creado correctamente con Firebase Auth.');
                } catch(err) {
                    console.error('Crear conductor Firebase Auth:', err);
                    alert('No se pudo crear el conductor. Revisa que el correo sea válido y que la contraseña tenga mínimo 6 caracteres.');
                }
            };

            const saveEmailSettings = async (e) => {
                e.preventDefault();
                const next = {
                    senderEmail: emailSettings.senderEmail.trim(),
                    appPassword: emailSettings.appPassword.trim(),
                    receiverEmail: emailSettings.receiverEmail.trim(),
                    updatedAt: Date.now(),
                    updatedBy: sessionUser?.email || ''
                };
                if (!next.senderEmail || !next.appPassword || !next.receiverEmail) {
                    alert('Completa correo remitente, contraseña de aplicación y correo base receptor.');
                    return;
                }
                setEmailSaving(true);
                try {
                    await saveDoc('mail_settings', 'config', next);
                    try { localStorage.setItem('driveMxEmailSettings', JSON.stringify(next)); } catch(err) {}
                    alert('Configuración de correo guardada correctamente.');
                } catch(err) {
                    console.error('Guardar configuración de correo:', err);
                    alert('No se pudo guardar la configuración de correo.');
                } finally {
                    setEmailSaving(false);
                }
            };

            const savePaymentSettings = async (e) => {
                e.preventDefault();
                const next = {
                    bankAccount: paymentSettings.bankAccount.trim(),
                    paypalClientId: paymentSettings.paypalClientId.trim(),
                    paypalClientSecret: paymentSettings.paypalClientSecret.trim(),
                    updatedAt: Date.now(),
                    updatedBy: sessionUser?.email || ''
                };
                if (!next.bankAccount) {
                    alert('Configura el número de cuenta bancaria.');
                    return;
                }
                setPaymentSaving(true);
                try {
                    await saveDoc('payment_settings', 'config', next);
                    try { localStorage.setItem('driveMxPaymentSettings', JSON.stringify(next)); } catch(err) {}
                    alert('Configuración de pagos guardada correctamente.');
                } catch(err) {
                    console.error('Guardar configuración de pagos:', err);
                    alert('No se pudo guardar la configuración de pagos.');
                } finally {
                    setPaymentSaving(false);
                }
            };

            const buildOrderPayload = () => ({
                mailSettings: {
                    senderEmail: emailSettings.senderEmail.trim(),
                    appPassword: emailSettings.appPassword.trim(),
                    receiverEmail: emailSettings.receiverEmail.trim()
                },
                product: {
                    id: selectedProduct?.id || '',
                    name: selectedProduct?.name || '',
                    price: Number(selectedProduct?.price || 0)
                },
                delivery: {
                    street: deliveryForm.street.trim(),
                    state: deliveryForm.state.trim(),
                    municipality: deliveryForm.municipality.trim(),
                    neighborhood: deliveryForm.neighborhood.trim(),
                    zip: deliveryForm.zip.trim(),
                    fullName: deliveryForm.fullName.trim(),
                    phone: deliveryForm.phone.trim(),
                    email: deliveryForm.email.trim(),
                    references: deliveryForm.references.trim()
                }
            });

            const sendOrderEmail = async (payload) => {
                if (!payload.mailSettings.senderEmail || !payload.mailSettings.appPassword || !payload.mailSettings.receiverEmail) {
                    throw new Error('Falta configurar el correo en el Panel Admin.');
                }
                const res = await fetch('/api/send-order-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok || !data.success) throw new Error(data.error || 'No se pudo enviar el correo.');
                return data;
            };

            const createPendingTransfer = async () => {
                if (!paymentSettings.bankAccount.trim()) {
                    alert('Falta configurar el número de cuenta bancaria en el Panel Admin.');
                    return;
                }
                setOrderSending(true);
                try {
                    const payload = buildOrderPayload();
                    const id = `TR-${Date.now()}`;
                    await saveDoc('bank_transfers', id, {
                        transferId: id,
                        paymentMethod: 'Transferencia bancaria',
                        bankAccount: paymentSettings.bankAccount.trim(),
                        bankLegend: 'Banco Azteca, el nombre del titular debe coincidir con el nombre registrado en el pedido.',
                        holderName: payload.delivery.fullName,
                        status: 'Pendiente',
                        order: payload,
                        createdAt: Date.now(),
                        updatedAt: Date.now()
                    });
                    alert('Transferencia registrada como Pendiente. Tu solicitud se procesará cuando el administrador confirme el pago.');
                    resetPublicFlow();
                } catch(err) {
                    console.error('Registrar transferencia:', err);
                    alert('No se pudo registrar la transferencia pendiente.');
                } finally {
                    setOrderSending(false);
                }
            };

            const confirmPaypalPayment = async () => {
                setOrderSending(true);
                try {
                    await sendOrderEmail(buildOrderPayload());
                    alert('Pago PayPal confirmado. La solicitud fue enviada correctamente.');
                    resetPublicFlow();
                } catch(err) {
                    console.error('Confirmar PayPal:', err);
                    alert(err.message || 'No se pudo procesar el pago PayPal.');
                } finally {
                    setOrderSending(false);
                }
            };

            const markTransferPaid = async (transfer) => {
                if (sessionUser?.role !== 'admin' || transfer.status !== 'Pendiente') return;
                setOrderSending(true);
                try {
                    await sendOrderEmail({
                        ...transfer.order,
                        mailSettings: {
                            senderEmail: emailSettings.senderEmail.trim(),
                            appPassword: emailSettings.appPassword.trim(),
                            receiverEmail: emailSettings.receiverEmail.trim()
                        }
                    });
                    await saveDoc('bank_transfers', transfer.id || transfer.transferId, { ...transfer, status: 'Pagado', paidAt: Date.now(), updatedAt: Date.now(), paidBy: sessionUser?.email || '' });
                    alert('Transferencia marcada como Pagado y correo enviado correctamente.');
                } catch(err) {
                    console.error('Marcar transferencia pagada:', err);
                    alert(err.message || 'No se pudo confirmar la transferencia.');
                } finally {
                    setOrderSending(false);
                }
            };

            const validateDeliveryForm = () => {
                const requiredFields = [
                    ['street', 'La calle es obligatoria.'],
                    ['state', 'El estado es obligatorio.'],
                    ['municipality', 'El municipio es obligatorio.'],
                    ['neighborhood', 'La colonia es obligatoria.'],
                    ['zip', 'El código postal es obligatorio.'],
                    ['fullName', 'El nombre completo es obligatorio.'],
                    ['phone', 'El teléfono es obligatorio.'],
                    ['email', 'El correo electrónico es obligatorio.'],
                    ['references', 'Las referencias del domicilio son obligatorias.']
                ];
                for (const [field, message] of requiredFields) {
                    if (!String(deliveryForm[field] || '').trim()) {
                        alert(message);
                        return false;
                    }
                }
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(deliveryForm.email.trim())) {
                    alert('Ingresa un correo electrónico válido.');
                    return false;
                }
                return true;
            };

            const resetDeliveryForm = () => {
                setDeliveryForm({ street: '', state: '', municipality: '', neighborhood: '', zip: '', fullName: '', phone: '', email: '', references: '' });
            };

            const handleDeliveryContinue = async () => {
                if (!selectedProduct) {
                    alert('No se encontró el producto seleccionado.');
                    return;
                }
                if (!validateDeliveryForm()) return;
                setSelectedPaymentMethod('paypal');
                setView('payment-method');
            };

            const findProductByTracking = (tracking) => {
                if (!tracking) return null;
                const productId = tracking.productId || tracking.product?.id || tracking.order?.product?.id || '';
                return products.find(p => String(p.id) === String(productId)) || tracking.product || tracking.order?.product || null;
            };

            const normalizeTrackingCode = (value) => String(value || '').toUpperCase().trim();

            const buildPackageFromOrder = (transfer, trackingCode) => {
                const order = transfer?.order || {};
                const product = order.product || {};
                const delivery = order.delivery || {};
                const address = [delivery.street, delivery.neighborhood, delivery.municipality, delivery.state, delivery.zip].filter(Boolean).join(', ');
                return {
                    id: trackingCode,
                    trackingNumber: trackingCode,
                    orderId: transfer?.id || transfer?.transferId || '',
                    transferId: transfer?.id || transfer?.transferId || '',
                    productId: product.id || '',
                    product: { ...product },
                    customer: {
                        fullName: delivery.fullName || transfer?.holderName || '',
                        phone: delivery.phone || '',
                        email: delivery.email || ''
                    },
                    delivery: { ...delivery },
                    o: 'DRIVE MX',
                    d: address || 'Dirección registrada',
                    op: '',
                    status: 'Recolectado',
                    currentStep: 0,
                    createdAt: Date.now(),
                    updatedAt: Date.now()
                };
            };

            const assignTrackingToTransfer = async (transfer) => {
                if (sessionUser?.role !== 'admin') return;
                const transferId = transfer?.id || transfer?.transferId;
                const code = normalizeTrackingCode(transferTrackingDrafts[transferId] || transfer?.trackingNumber || '');
                if (!code) { alert('Ingresa el número de guía.'); return; }
                const pkg = buildPackageFromOrder(transfer, code);
                await saveDoc('packages', code, pkg);
                await saveDoc('bank_transfers', transferId, { ...transfer, trackingNumber: code, packageId: code, updatedAt: Date.now(), trackingAssignedAt: Date.now(), trackingAssignedBy: sessionUser?.email || '' });
                setTransferTrackingDrafts(prev => ({ ...prev, [transferId]: '' }));
                alert('Guía asociada al pedido y producto correctamente.');
            };

            const runTrackingSearch = (value, notify = false) => {
                const code = normalizeTrackingCode(value);
                setSearchQuery(value);
                if (!code) {
                    setTrackingResult(null);
                    setTrackingNotFound(false);
                    return;
                }
                const foundPkg = pkgs.find(x => normalizeTrackingCode(x.id || x.trackingNumber || x.packageId) === code);
                const foundTransfer = pendingTransfers.find(t => normalizeTrackingCode(t.trackingNumber || t.packageId) === code);
                const found = foundPkg || (foundTransfer ? buildPackageFromOrder(foundTransfer, code) : null);
                setTrackingResult(found || null);
                setTrackingNotFound(!found);
                if (!found && notify) alert('No se encontró el envío');
            };

            const getSupportUserId = () => sessionUser?.uid || sessionUser?.id || fbUser?.uid || 'local';
            const activeSupportChat = supportChats.find(c => c.id === activeSupportChatId) || null;
            const adminSelectedSupportChat = activeSupportChat || supportChats.find(c => c.status === 'open') || null;

            const createSupportChat = async (userId, userEmail = '') => {
                const id = `support_${userId}_${Date.now()}`;
                const chat = {
                    chatId: id,
                    userId,
                    userEmail,
                    status: 'open',
                    messages: [],
                    createdAt: Date.now(),
                    updatedAt: Date.now()
                };
                await saveDoc('support_chats', id, chat);
                setActiveSupportChatId(id);
                return chat;
            };

            const openSupportFromCover = async () => {
                const userId = getSupportUserId();
                const active = supportChats.find(c => c.userId === userId && c.status === 'open');
                if (active) setActiveSupportChatId(active.id || active.chatId);
                else await createSupportChat(userId, 'Usuario portada');
                setView('support');
            };

            const openAdminSupport = () => {
                const firstOpen = supportChats.find(c => c.status === 'open') || supportChats[0];
                setActiveSupportChatId(firstOpen?.id || firstOpen?.chatId || '');
                setShowAdminMenu(false);
                setView('admin-support');
            };

            const openAdminTracking = () => {
                setShowAdminMenu(false);
                setSearchQuery('');
                setTrackingResult(null);
                setTrackingNotFound(false);
                setView('admin-tracking');
            };

            const sendSupportMessage = async (role = 'user') => {
                const text = supportInput.trim();
                if (!text) return;
                let chat = role === 'admin' ? adminSelectedSupportChat : activeSupportChat;
                if (!chat && role !== 'admin') chat = await createSupportChat(getSupportUserId(), 'Usuario portada');
                if (!chat || chat.status === 'closed') return;
                const id = chat.id || chat.chatId;
                const message = {
                    id: `msg_${Date.now()}`,
                    text,
                    sender: role,
                    senderName: role === 'admin' ? 'Soporte Técnico' : 'Usuario',
                    createdAt: Date.now()
                };
                await saveDoc('support_chats', id, { ...chat, messages: [...(chat.messages || []), message], updatedAt: Date.now() });
                setActiveSupportChatId(id);
                setSupportInput('');
            };

            const closeSupportChat = async (chat) => {
                if (!chat) return;
                const id = chat.id || chat.chatId;
                await saveDoc('support_chats', id, { ...chat, status: 'closed', closedAt: Date.now(), updatedAt: Date.now(), closedBy: sessionUser?.email || 'admin' });
                const newChat = await createSupportChat(chat.userId || getSupportUserId(), chat.userEmail || 'Usuario portada');
                setActiveSupportChatId(newChat.chatId);
            };


            return (
                <div className="min-h-screen flex flex-col">
                    <header className="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between sticky top-0 z-50">
                        <div className="flex items-center gap-3 cursor-pointer" onClick={resetPublicFlow}>
                            <div className="w-9 h-9 bg-red-500 rounded-xl flex items-center justify-center text-white shadow-lg shadow-red-100">
                                <Icons.Truck size={18} />
                            </div>
                            <span className="font-extrabold text-sm tracking-tight">DRIVE <span className="text-red-500">MX</span></span>
                        </div>
                        {sessionUser ? (
                            <div className="flex items-center gap-4">
                                <div className="text-right hidden sm:block">
                                    <p className="text-[10px] font-bold leading-none">{sessionUser.name}</p>
                                    <p className="text-[8px] font-black text-red-500 uppercase">{sessionUser.role}</p>
                                </div>
                                <button onClick={handleLogout} className="p-2 text-slate-400"><Icons.LogOut /></button>
                            </div>
                        ) : (
                            <div className="flex items-center gap-3">
                                <button onClick={openSupportFromCover} className="px-3 py-2 bg-slate-100 text-slate-600 rounded-xl text-[9px] font-black uppercase tracking-widest hover:bg-red-50 hover:text-red-600">Soporte Técnico</button>
                                <button onClick={() => { resetPublicFlow(); setLoginForm({ email: '', p: '' }); setView('login'); }} className="text-[9px] font-black uppercase text-slate-400 tracking-widest">Acceso Staff</button>
                            </div>
                        )}
                    </header>

                    <main className="flex-grow p-6 flex flex-col items-center">
                        {view === 'home' && (
                            <div className="w-full max-w-6xl py-10 space-y-8 animate-slide">
                                <div className="text-center max-w-xl mx-auto">
                                    <h1 className="text-4xl font-black text-slate-900 tracking-tight mb-2">Productos <span className="text-red-500">Drive MX</span></h1>
                                    <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Portada de productos</p>
                                </div>

                                    <div className="w-full mt-6 animate-slide space-y-10">
                                        <div className="max-w-xl mx-auto">
                                            <img src="repartidora.png" alt="Drive MX" className="w-full h-auto" />
                                        </div>

                                        {activeProducts.length > 0 && (
                                            <section className="w-full">
                                                <div className="flex items-end justify-between gap-4 mb-5">
                                                    <div>
                                                        <p className="text-[10px] text-red-500 font-black uppercase tracking-widest">Inventario disponible</p>
                                                        <h2 className="text-2xl font-black tracking-tight">Productos <span className="text-red-500">Drive MX</span></h2>
                                                    </div>
                                                    <p className="hidden sm:block text-[9px] font-bold text-slate-400 uppercase tracking-widest">Actualizado automáticamente</p>
                                                </div>
                                                <div className="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                                                    {activeProducts.map(product => (
                                                        <article key={product.id} onClick={() => { setSelectedProductId(product.id); setCurrentImageIndex(0); setView('product-detail'); }} className="bg-white rounded-[1.35rem] border border-slate-100 overflow-hidden shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-200 cursor-pointer">
                                                            <div className="aspect-[4/3] bg-slate-100 overflow-hidden">
                                                                {getProductGallery(product)[0] ? (
                                                                    <img src={getProductGallery(product)[0]} alt={product.name} className="w-full h-full object-cover" />
                                                                ) : (
                                                                    <div className="w-full h-full flex items-center justify-center text-[10px] font-black text-slate-300 uppercase tracking-widest">Sin foto</div>
                                                                )}
                                                            </div>
                                                            <div className="p-5 space-y-3">
                                                                <div>
                                                                    <h3 className="text-sm font-black text-slate-900 leading-tight">{product.name}</h3>
                                                                    <p className="text-[9px] font-bold text-slate-400 uppercase mt-1">ID: {product.id}</p>
                                                                </div>
                                                                <div className="flex items-center justify-between gap-3">
                                                                    <p className="text-xl font-black text-red-500">${Number(product.price || 0).toFixed(2)}</p>
                                                                    <span className="px-3 py-1 bg-slate-50 rounded-full text-[9px] font-black text-slate-500 uppercase">Stock: {Number(product.stock || 0)}</span>
                                                                </div>
                                                            </div>
                                                        </article>
                                                    ))}
                                                </div>
                                            </section>
                                        )}
                                    </div>
                                
                            </div>
                        )}

                        {view === 'product-detail' && selectedProduct && (
                            <div className="w-full max-w-6xl py-6 animate-slide">
                                <button onClick={resetPublicFlow} className="mb-6 text-[10px] font-black uppercase text-slate-400 hover:text-red-500">← Volver a productos</button>
                                <div className="grid lg:grid-cols-2 gap-8 items-start">
                                    <div className="card-glass p-4 space-y-4">
                                        <div className="relative aspect-square bg-slate-100 rounded-[1.5rem] overflow-hidden flex items-center justify-center">
                                            {selectedMainImage ? (
                                                <img src={selectedMainImage} alt={selectedProduct.name} className="w-full h-full object-cover" />
                                            ) : (
                                                <div className="text-[10px] font-black text-slate-300 uppercase tracking-widest">Sin fotografías</div>
                                            )}
                                            {selectedGallery.length > 1 && (
                                                <>
                                                    <button onClick={() => setCurrentImageIndex((currentImageIndex - 1 + selectedGallery.length) % selectedGallery.length)} className="absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/90 shadow flex items-center justify-center text-slate-700 hover:text-red-500"><Icons.ChevronLeft /></button>
                                                    <button onClick={() => setCurrentImageIndex((currentImageIndex + 1) % selectedGallery.length)} className="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/90 shadow flex items-center justify-center text-slate-700 hover:text-red-500"><Icons.ChevronRight /></button>
                                                </>
                                            )}
                                        </div>
                                        {selectedGallery.length > 0 && (
                                            <div className="grid grid-cols-5 gap-3">
                                                {selectedGallery.map((img, i) => (
                                                    <button key={img + i} onClick={() => setCurrentImageIndex(i)} className={`aspect-square rounded-xl overflow-hidden border-2 bg-slate-100 ${currentImageIndex === i ? 'border-red-500' : 'border-transparent'}`}>
                                                        <img src={img} alt={`${selectedProduct.name} ${i+1}`} className="w-full h-full object-cover" />
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    <div className="card-glass p-8 lg:p-10 space-y-7">
                                        <div>
                                            <p className="text-[10px] text-red-500 font-black uppercase tracking-widest mb-2">Detalle del producto</p>
                                            <h1 className="text-3xl sm:text-4xl font-black tracking-tight leading-tight">{selectedProduct.name}</h1>
                                            <p className="text-[9px] font-bold text-slate-400 uppercase mt-2">ID: {selectedProduct.id}</p>
                                        </div>

                                        <div className="flex flex-wrap items-center gap-4">
                                            <p className="text-4xl font-black text-red-500">${Number(selectedProduct.price || 0).toFixed(2)}</p>
                                            <span className="px-4 py-2 bg-slate-50 rounded-full text-[10px] font-black text-slate-500 uppercase">Disponibles: {Number(selectedProduct.stock || 0)}</span>
                                        </div>

                                        <div className="space-y-3">
                                            <h2 className="text-[10px] font-black uppercase tracking-widest text-slate-400">Descripción</h2>
                                            <p className="text-sm font-semibold text-slate-600 leading-relaxed whitespace-pre-line">{selectedProduct.description || 'Sin descripción registrada.'}</p>
                                        </div>

                                        <div className="space-y-3">
                                            <h2 className="text-[10px] font-black uppercase tracking-widest text-slate-400">Especificaciones</h2>
                                            <p className="text-sm font-semibold text-slate-600 leading-relaxed whitespace-pre-line">{selectedProduct.specifications || 'Sin especificaciones registradas.'}</p>
                                        </div>

                                        <button type="button" onClick={() => setView('delivery-data')} className="btn-primary w-full sm:w-auto h-12">Comprar</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'delivery-data' && selectedProduct && (
                            <div className="w-full max-w-5xl py-6 animate-slide">
                                <button onClick={() => { resetDeliveryForm(); setView('product-detail'); }} className="mb-6 text-[10px] font-black uppercase text-slate-400 hover:text-red-500">← Volver al detalle</button>
                                <div className="card-glass overflow-hidden">
                                    <div className="bg-white border-b border-slate-100 px-6 py-5 flex items-center justify-between gap-4">
                                        <div>
                                            <p className="text-[10px] text-red-500 font-black uppercase tracking-widest mb-1">Producto seleccionado: {selectedProduct.name}</p>
                                            <h1 className="text-2xl sm:text-3xl font-black tracking-tight">Datos de entrega</h1>
                                            <p className="text-[9px] font-bold text-slate-400 uppercase mt-1">ID del producto conservado: {selectedProduct.id}</p>

                                            <div>
                                                <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Colonia</label>

                                                <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Nombre completo</label>

                                            </div>
                                            <div>
                                                <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Teléfono</label>
                                                <input className="input-field" placeholder="Teléfono" inputMode="tel" value={deliveryForm.phone} onChange={e => setDeliveryForm({...deliveryForm, phone: e.target.value})} />
                                            </div>
                                            <div className="md:col-span-2">
                                                <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Correo electrónico</label>
                                                <input className="input-field" placeholder="Correo electrónico" type="email" value={deliveryForm.email} onChange={e => setDeliveryForm({...deliveryForm, email: e.target.value})} />
                                            </div>
                                            <div className="md:col-span-2">
                                                <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Referencias del domicilio</label>
                                                <textarea className="input-field min-h-[120px] resize-none" placeholder="Referencias del domicilio" value={deliveryForm.references} onChange={e => setDeliveryForm({...deliveryForm, references: e.target.value})}></textarea>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}


                        {view === 'payment-method' && selectedProduct && (
                            <div className="w-full max-w-4xl py-6 animate-slide">
                                <button onClick={resetAfterIncompletePayment} className="mb-6 text-[10px] font-black uppercase text-slate-400 hover:text-red-500">← Cancelar pago y volver al inicio</button>
                                <div className="card-glass overflow-hidden">
                                    <div className="bg-white border-b border-slate-100 px-6 py-5">
                                        <p className="text-[10px] text-red-500 font-black uppercase tracking-widest mb-1">Producto seleccionado: {selectedProduct.name}</p>
                                        <h1 className="text-2xl sm:text-3xl font-black tracking-tight">Método de pago</h1>
                                        <p className="text-[9px] font-bold text-slate-400 uppercase mt-1">ID del producto conservado: {selectedProduct.id}</p>
                                    </div>
                                    <div className="p-6 lg:p-8 space-y-5">
                                        <div className="grid md:grid-cols-2 gap-4">
                                            {[
                                                ['paypal', 'PayPal', 'Completa el pago para procesar la solicitud.'],
                                                ['transfer', 'Transferencia bancaria', 'Queda Pendiente hasta que el administrador confirme el pago.']
                                            ].map(([value, title, desc]) => (
                                                <label key={value} className={`border-2 rounded-2xl p-5 cursor-pointer hover:border-red-200 transition-all bg-white ${selectedPaymentMethod === value ? 'border-red-400' : 'border-slate-100'}`}>
                                                    <div className="flex items-start gap-3">
                                                        <input type="radio" name="paymentMethod" className="mt-1" checked={selectedPaymentMethod === value} onChange={() => setSelectedPaymentMethod(value)} />
                                                        <div>
                                                            <p className="text-sm font-black text-slate-800">{title}</p>
                                                            <p className="text-[10px] font-bold text-slate-400 uppercase mt-1 leading-relaxed">{desc}</p>
                                                        </div>
                                                    </div>
                                                </label>
                                            ))}
                                        </div>

                                        {selectedPaymentMethod === 'transfer' && (
                                            <div className="bg-slate-50 rounded-2xl p-5 space-y-3">
                                                <p className="text-[9px] font-black text-slate-400 uppercase">Cuenta bancaria Banco Azteca</p>
                                                <p className="text-2xl font-black text-slate-900 break-all">{paymentSettings.bankAccount || 'Cuenta no configurada'}</p>
                                                <p className="text-[10px] font-bold text-slate-500 uppercase leading-relaxed">Banco Azteca, el nombre del titular debe coincidir con el nombre registrado en el pedido.</p>
                                            </div>
                                        )}

                                        {selectedPaymentMethod === 'paypal' && (
                                            <div className="bg-blue-50 rounded-2xl p-5 space-y-2">
                                                <p className="text-[9px] font-black text-blue-500 uppercase">PayPal</p>
                                                <p className="text-[10px] font-bold text-slate-500 uppercase leading-relaxed">PayPal se abrirá en español México. El correo de nueva solicitud se enviará únicamente cuando el pago sea confirmado exitosamente.</p>
                                                {!paymentSettings.paypalClientId && <p className="text-[10px] font-black text-red-500 uppercase">Falta configurar las claves de PayPal en el Panel Admin.</p>}
                                                {(!emailSettings.senderEmail || !emailSettings.appPassword || !emailSettings.receiverEmail) && <p className="text-[10px] font-black text-red-500 uppercase">Falta configurar el correo receptor/remitente en el Panel Admin.</p>}
                                            </div>
                                        )}

                                            <div>
                                                <p className="text-[9px] font-black text-slate-400 uppercase">Total</p>
                                                <p className="text-3xl font-black text-red-500">${Number(selectedProduct.price || 0).toFixed(2)}</p>
                                            </div>
                                            {selectedPaymentMethod === 'transfer' ? (
                                                <button type="button" onClick={createPendingTransfer} disabled={orderSending || !paymentSettings.bankAccount} className="btn-primary h-12 disabled:opacity-50 disabled:cursor-not-allowed">{orderSending ? 'Registrando...' : 'Registrar transferencia pendiente'}</button>

                                                <div className="w-full sm:max-w-xs">
                                                    <div id="paypal-buttons-container" className={orderSending ? 'pointer-events-none opacity-50' : ''}></div>
                                                    {(!paymentSettings.paypalClientId || !emailSettings.senderEmail || !emailSettings.appPassword || !emailSettings.receiverEmail) && <button type="button" disabled className="btn-primary h-12 w-full opacity-50 cursor-not-allowed">Configura PayPal y Correo</button>}
                                                </div>
                                            )}
                                        </div>
                                        <button type="button" onClick={resetAfterIncompletePayment} className="w-full text-[9px] font-black text-slate-400 uppercase hover:text-red-500">Cancelar método de pago y restablecer pantalla</button>

                                </div>
                            </div>
                        )}

                        {view === 'admin' && (
                            <div className="w-full max-w-5xl space-y-8 animate-slide">
                                <div className="flex justify-between items-start gap-4">

                                    <div className="flex items-start gap-3 relative">
                                        <button onClick={() => setShowStaffModal(true)} className="btn-primary">Registrar Conductor</button>
                                        <button type="button" onClick={() => setShowAdminMenu(!showAdminMenu)} className="w-12 h-12 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-slate-600 hover:text-red-500 shadow-sm"><Icons.Menu /></button>
                                        {showAdminMenu && (
                                            <div className="absolute right-0 top-14 w-56 bg-white border border-slate-100 rounded-2xl shadow-xl p-2 z-50 animate-slide">
                                                <button type="button" onClick={openAdminTracking} className="w-full text-left px-4 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest text-slate-600 hover:bg-red-50 hover:text-red-600">Buscador de Guías</button>
                                                <button type="button" onClick={openAdminSupport} className="w-full text-left px-4 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest text-slate-600 hover:bg-red-50 hover:text-red-600">Soporte Técnico</button>
                                            </div>
                                        )}
                                    </div>
                                </div>
                                
                                <div className="grid md:grid-cols-3 gap-8">
                                    <div className="md:col-span-1 card-glass p-6 space-y-6">
                                        <h2 className="text-[10px] font-black uppercase tracking-widest text-slate-400">Nuevo Envío</h2>
                                        <form onSubmit={(e) => { e.preventDefault(); const n = { ...pkgForm, id: pkgForm.id.toUpperCase(), status: 'Recolectado', currentStep: 0 }; saveDoc('packages', n.id, n); setPkgForm({ id: '', o: '', d: '', op: '', productId: '' }); }} className="space-y-4">
                                            <input required className="input-field uppercase" placeholder="NÚMERO DE GUÍA" value={pkgForm.id} onChange={e => setPkgForm({...pkgForm, id: e.target.value})} />
                                            <input required className="input-field uppercase" placeholder="ORIGEN" value={pkgForm.o} onChange={e => setPkgForm({...pkgForm, o: e.target.value})} />
                                            <input required className="input-field uppercase" placeholder="DESTINO" value={pkgForm.d} onChange={e => setPkgForm({...pkgForm, d: e.target.value})} />
                                            <select required className="input-field" value={pkgForm.op} onChange={e => setPkgForm({...pkgForm, op: e.target.value})}>
                                                <option value="">ASIGNAR CONDUCTOR</option>
                                                {ops.filter(o => o.role === 'operador' && o.active !== false).map(o => <option key={o.id} value={o.id}>{o.name}</option>)}
                                            </select>
                                            <button type="submit" className="w-full btn-primary h-12">Crear Guía</button>
                                        </form>
                                    </div>
                                    
                                    <div className="md:col-span-2 space-y-8">
                                        <div className="card-glass overflow-hidden">
                                            <div className="bg-slate-50 border-b border-slate-100 px-6 py-4">
