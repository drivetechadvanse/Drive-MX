                                <textarea className="input-field md:col-span-5 min-h-[90px] resize-y" placeholder="ESPECIFICACIONES" value={userProductForm.specifications} onChange={e => setUserProductForm({...userProductForm, specifications: e.target.value})}></textarea>
                                <button disabled={userProductUploading} type="submit" className="md:col-span-5 btn-primary h-12 disabled:opacity-50 disabled:cursor-not-allowed">{userProductUploading ? 'Guardando...' : (editingUserProductId ? 'Guardar Cambios' : 'Agregar Producto')}</button>
                            </form>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left">
                                <thead className="bg-white border-b border-slate-50">
                                    <tr className="text-[8px] font-black uppercase text-slate-400">
                                        <th className="px-6 py-3">Foto</th>
                                        <th className="px-6 py-3">Producto</th>
                                        <th className="px-6 py-3">Precio</th>
                                        <th className="px-6 py-3">Inventario</th>
                                        <th className="px-6 py-3">Estado</th>
                                        <th className="px-6 py-3 text-right">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-50">
                                    {currentUserProducts.map(product => {
                                        const productStock = Math.max(0, Math.floor(Number(product.stock ?? product.availableStock ?? 0)));
                                        const productSoldOut = productStock <= 0;
                                        const productStatusLabel = productSoldOut ? 'Agotado' : (product.active !== false ? 'Activo' : 'Inactivo');
                                        const productStatusClass = productSoldOut ? 'bg-red-50 text-red-600' : (product.active !== false ? 'bg-green-50 text-green-600' : 'bg-slate-100 text-slate-400');
                                        return (
                                            <tr key={product.id} className="text-[10px] font-bold text-slate-600">
                                                <td className="px-6 py-4">
                                                    <div className="w-12 h-12 rounded-xl bg-slate-100 overflow-hidden">
                                                        {getProductGallery(product)[0] ? <img src={getProductGallery(product)[0]} alt={product.name} className="w-full h-full object-cover" /> : null}
                                                    </div>
                                                </td>
                                                <td className="px-6 py-4"><p className="font-black text-slate-800">{product.name}</p><p className="font-mono text-[8px] text-slate-400">{product.id}</p></td>
                                                <td className="px-6 py-4 text-red-600 font-black">${Number(product.price || 0).toFixed(2)}</td>
                                                <td className="px-6 py-4">{productStock}</td>
                                                <td className="px-6 py-4"><span className={`px-2 py-1 rounded-full text-[8px] uppercase ${productStatusClass}`}>{productStatusLabel}</span></td>
                                                <td className="px-6 py-4 text-right">
                                                    <div className="flex justify-end gap-2 flex-wrap">
                                                        <button onClick={() => editUserProduct(product)} className="px-2 py-1 bg-slate-100 rounded-lg text-[8px] font-black uppercase">Editar</button>
                                                        <button onClick={() => toggleUserProduct(product)} className="px-2 py-1 bg-slate-100 rounded-lg text-[8px] font-black uppercase">{product.active !== false ? 'Desactivar' : 'Activar'}</button>
                                                        <button onClick={() => deleteUserProduct(product)} className="text-slate-300 hover:text-red-500"><Icons.Trash /></button>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                    {currentUserProducts.length === 0 && (
                                        <tr><td colSpan="6" className="px-6 py-8 text-center text-[10px] font-bold text-slate-300 uppercase">Aún no tienes publicaciones registradas</td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </>
            );

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between sticky top-0 z-50">
                        <div className="flex items-center gap-3 cursor-pointer" onClick={resetPublicFlow}>
                            <div className="w-9 h-9 bg-red-500 rounded-xl flex items-center justify-center text-white shadow-lg shadow-red-100">
                                <Icons.Truck size={18} />
                            </div>
                        </div>
                        {sessionUser ? (
                            <div className="flex items-center gap-4">
                                <div className="text-right hidden sm:block">
                                    <p className="text-[10px] font-bold leading-none">{sessionUser.name}</p>
                                    <p className="text-[8px] font-black text-red-500 uppercase">{sessionUser.role}</p>
                                </div>
                                <button onClick={handleLogout} className="p-2 text-slate-400"><Icons.LogOut /></button>
                            </div>
                        ) : (
                            <div className="flex items-center gap-3">
                                <button type="button" onClick={() => { setIsCartOpen(true); }} className="relative w-11 h-11 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center hover:bg-red-50 hover:text-red-600" aria-label="Abrir carrito">
                                    <Icons.Cart size={19} />
                                    {cartItems.length > 0 && <span className="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[9px] font-black flex items-center justify-center">{cartItems.length}</span>}
                                </button>
                                <button onClick={openSupportFromCover} className="px-3 py-2 bg-slate-100 text-slate-600 rounded-xl text-[9px] font-black uppercase tracking-widest hover:bg-red-50 hover:text-red-600">Soporte Técnico</button>
                                <button onClick={() => { resetPublicFlow(); setLoginForm({ email: '', p: '' }); setView('login'); }} className="text-[9px] font-black uppercase text-slate-400 tracking-widest">Registrarse</button>
                            </div>
                        )}
                    </header>

                    {isCartOpen && (
                        <div className="fixed inset-0 z-[80] bg-slate-900/40 backdrop-blur-sm flex items-start justify-center p-4 sm:p-6">
                            <div className="w-full max-w-md bg-white rounded-[1.5rem] shadow-2xl border border-slate-100 overflow-hidden animate-slide mt-16">
                                <div className="bg-slate-50 border-b border-slate-100 px-5 py-4 flex items-center justify-between gap-3">
                                    <div>
                                        <p className="text-[9px] text-red-500 font-black uppercase tracking-widest">Carrito de compra</p>
                                        <h2 className="text-xl font-black tracking-tight">Productos seleccionados</h2>
                                        <p className="text-[9px] font-bold text-slate-400 uppercase mt-1">Máximo {CART_MAX_ITEMS} productos · se limpia automáticamente en {Math.round(CART_TTL_MS / 60000)} minutos</p>
                                    </div>
                                    <button type="button" onClick={() => setIsCartOpen(false)} className="w-9 h-9 rounded-xl bg-white text-slate-400 hover:text-red-500 font-black">×</button>
                                </div>

                                <div className="p-5 space-y-4">
                                    {cartProducts.length === 0 ? (
                                        <div className="text-center py-8 bg-slate-50 rounded-2xl">
                                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Tu carrito está vacío</p>
                                            <p className="text-[10px] font-bold text-slate-300 uppercase mt-1">Agrega productos desde el detalle de cada publicación</p>
                                        </div>
                                    ) : (
                                        <div className="space-y-3">
                                            {cartProducts.map(product => (
                                                <div key={product.id} className="flex items-center justify-between gap-3 bg-slate-50 rounded-2xl p-3">
                                                    <div className="min-w-0">
                                                        <p className="text-sm font-black text-slate-900 truncate">{product.name}</p>
                                                        <p className="text-[9px] font-bold text-slate-400 uppercase">Cantidad: {Number(product.quantity || 0)} · Unitario: ${Number(product.unitPrice || product.price || 0).toFixed(2)}</p>
                                                        {getProductStock(product) <= 0 && <p className="text-[8px] font-black text-red-500 uppercase">Agotado</p>}
                                                    </div>
                                                    <div className="text-right shrink-0">
                                                        <p className="text-sm font-black text-red-500">${getProductLineTotal(product, product.quantity).toFixed(2)}</p>
                                                        <button type="button" onClick={() => removeProductFromCart(product.id)} className="text-[8px] font-black uppercase text-slate-300 hover:text-red-500">Quitar</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    <div className="bg-white border border-slate-100 rounded-2xl p-4 flex items-center justify-between gap-4">
                                        <div>
                                            <p className="text-[9px] font-black text-slate-400 uppercase">Total acumulado</p>
                                            <p className="text-[9px] font-bold text-slate-300 uppercase">{cartProducts.length} producto{cartProducts.length === 1 ? '' : 's'} · {cartProducts.reduce((total, product) => total + Number(product.quantity || 0), 0)} unidad{cartProducts.reduce((total, product) => total + Number(product.quantity || 0), 0) === 1 ? '' : 'es'}</p>
                                        </div>
                                        <p className="text-2xl font-black text-red-500">${cartProducts.reduce((total, product) => total + getProductLineTotal(product, product.quantity), 0).toFixed(2)}</p>
                                    </div>

                                    <button type="button" onClick={startCartCheckout} disabled={cartProducts.length === 0 || cartProducts.some(product => Number(product.quantity || 0) < 1 || getProductStock(product) <= 0)} className="btn-primary w-full h-12 disabled:opacity-50 disabled:cursor-not-allowed">Quiero comprar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="flex-grow p-6 flex flex-col items-center">
                        {view === 'home' && (
                            <div className="w-full max-w-6xl py-10 space-y-8 animate-slide">
                                <div className="text-center max-w-xl mx-auto">
                                    <h1 className="text-4xl font-black text-slate-900 tracking-tight mb-2">Productos <span className="text-red-500">Drive MX</span></h1>
                                    <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Portada de productos</p>
                                </div>

                                    <div className="w-full mt-6 animate-slide space-y-10">
                                        <div className="max-w-xl mx-auto">
                                            <img src="repartidora.png" alt="Drive MX" className="w-full h-auto" />
                                        </div>

                                        <section className="card-glass p-6 max-w-3xl mx-auto space-y-4">
                                            <div className="text-center">
                                                <p className="text-[10px] text-red-500 font-black uppercase tracking-widest">Consultar número de guía</p>
                                                <h2 className="text-2xl font-black tracking-tight">Rastrea tu envío</h2>
                                                <p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1">Origen, destino y estado actualizado por el usuario</p>
                                            </div>
                                            <div className="bg-slate-50 p-2 rounded-2xl border-2 border-slate-100 flex gap-2">
                                                <input className="flex-grow bg-transparent px-4 text-sm font-bold uppercase outline-none" placeholder="INGRESA TU NÚMERO DE GUÍA" value={guideQuery} onChange={e => runGuideSearch(e.target.value, false)} />
                                                <button onClick={() => runGuideSearch(guideQuery, true)} className="btn-primary">Consultar</button>
                                            </div>
                                            {guideNotFound && <p className="text-center text-[10px] font-black text-red-500 uppercase tracking-widest">No se encontró la guía</p>}
                                            {!guideResult && !guideNotFound && <p className="text-center text-[10px] font-black text-slate-300 uppercase tracking-widest">Ingresa el número de guía registrado en Nuevo Envío</p>}
                                            {guideResult && <TrackingStatusCard pkg={guideResult} />}
                                        </section>

                                        {HomeProducts.HomeProductsSection && (
                                            <HomeProducts.HomeProductsSection
                                                products={activeProducts}
                                                ads={ads}
                                                getProductGallery={getProductGallery}
                                                onProductClick={(product) => { setSelectedProductId(product.id); setSelectedProductQuantity(1); setCurrentImageIndex(0); setView('product-detail'); }}
                                            />
                                        )}
                                    </div>
                                
                            </div>
                        )}

                        {view === 'product-detail' && selectedProduct && ProductDetails.ProductDetail && (
                            <ProductDetails.ProductDetail
                                product={selectedProduct}
                                gallery={selectedGallery}
                                currentImageIndex={currentImageIndex}
                                setCurrentImageIndex={setCurrentImageIndex}
                                quantity={selectedPurchaseQuantity}
                                onQuantityChange={setSelectedProductQuantity}
                                Icons={Icons}
                                productSizesText={productSizesText}
                                productColorsText={productColorsText}
                                onBack={resetPublicFlow}
                                onBuy={startSingleProductCheckout}
                                onAddToCart={addProductToCart}
                                isInCart={isProductInCart(selectedProduct.id)}
                            />
                        )}

                        {view === 'delivery-data' && checkoutProducts.length > 0 && (
                            <div className="w-full max-w-5xl py-6 animate-slide checkout-screen">
                                <button onClick={() => { resetDeliveryForm(); if (checkoutProductIds.length > 0) { setView('home'); setIsCartOpen(true); } else { setView('product-detail'); } }} className="mb-6 text-[10px] font-black uppercase text-slate-400 hover:text-red-500">← {checkoutProductIds.length > 0 ? 'Volver al carrito' : 'Volver al detalle'}</button>
                                <div className="card-glass checkout-card">
                                    <div className="bg-white border-b border-slate-100 px-6 py-5 flex items-center justify-between gap-4 checkout-header">
                                        <div className="checkout-title">
                                            <p className="text-[10px] text-red-500 font-black uppercase tracking-widest mb-1 checkout-product-label">{checkoutProducts.length > 1 ? 'Productos seleccionados' : 'Producto seleccionado'}: {checkoutProductNames}</p>
                                            <h1 className="text-2xl sm:text-3xl font-black tracking-tight">Datos de entrega</h1>
                                            <p className="text-[9px] font-bold text-slate-400 uppercase mt-1 checkout-id-label">ID{checkoutProducts.length > 1 ? 's' : ''} conservado{checkoutProducts.length > 1 ? 's' : ''}: {checkoutProductIdsLabel}</p>
                                        </div>
                                        <div className="flex items-center gap-3 shrink-0 checkout-actions">
                                            <button type="button" onClick={resetPublicFlow} className="text-[9px] font-black uppercase text-slate-400 hover:text-red-500">Cancelar</button>
                                            <button type="button" onClick={handleDeliveryContinue} disabled={orderSending} className="btn-primary h-11 disabled:opacity-50 disabled:cursor-not-allowed checkout-submit-button">{orderSending ? 'Procesando...' : 'Continuar'}</button>
                                        </div>
                                    </div>

                                    <form onSubmit={(e) => { e.preventDefault(); handleDeliveryContinue(); }} className="p-6 lg:p-8 space-y-6 checkout-form">
                                        <div className="bg-slate-50 rounded-2xl p-4 space-y-3">
                                            <div className="flex items-center justify-between gap-4">
                                                <p className="text-[9px] font-black text-slate-400 uppercase">Resumen de compra</p>
                                                <p className="text-[9px] font-black text-red-500 uppercase">{checkoutProducts.length}/{CART_MAX_ITEMS} productos · {checkoutTotalQuantity} unidad{checkoutTotalQuantity === 1 ? '' : 'es'}</p>
                                            </div>
                                            {checkoutProducts.map(product => (
                                                <div key={product.id} className="flex items-center justify-between gap-3 text-sm font-bold checkout-summary-row">
                                                    <span className="text-slate-700">{product.name} <span className="text-[10px] text-slate-400 uppercase">x{Number(product.quantity || 0)} · unitario ${Number(product.unitPrice || product.price || 0).toFixed(2)}</span></span>
                                                    <span className="text-red-500 font-black">${getProductLineTotal(product, product.quantity).toFixed(2)}</span>
                                                </div>
                                            ))}
                                            <div className="border-t border-slate-200 pt-3 flex items-center justify-between">
                                                <span className="text-[9px] font-black text-slate-400 uppercase">Subtotal productos</span>
                                                <span className="text-lg font-black text-red-500">${Number(checkoutSubtotal || 0).toFixed(2)}</span>
                                            </div>
                                            {checkoutProducts.length > 0 && (
                                                <div className="flex items-center justify-between gap-3 text-sm font-bold border-t border-slate-200 pt-3">
                                                    <span className="text-slate-700">Gastos de envio</span>
                                                    <span className="text-red-500 font-black">${Number(checkoutShippingFee || 0).toFixed(2)}</span>
                                                </div>
                                            )}
                                            <div className="border-t border-slate-200 pt-3 flex items-center justify-between">
                                                <span className="text-[9px] font-black text-slate-400 uppercase">Total a pagar</span>
                                                <span className="text-xl font-black text-red-500">${Number(checkoutTotal || 0).toFixed(2)}</span>
                                            </div>
                                        </div>
                                        <div className="grid md:grid-cols-2 gap-4">
                                            <div className="md:col-span-2">
                                                <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Calle</label>
                                                <input className="input-field" placeholder="Calle y número" value={deliveryForm.street} onChange={e => setDeliveryForm({...deliveryForm, street: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Estado</label>
                                                <input className="input-field" placeholder="Estado" value={deliveryForm.state} onChange={e => setDeliveryForm({...deliveryForm, state: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Municipio</label>
                                                <input className="input-field" placeholder="Municipio" value={deliveryForm.municipality} onChange={e => setDeliveryForm({...deliveryForm, municipality: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Colonia</label>
                                                <input className="input-field" placeholder="Colonia" value={deliveryForm.neighborhood} onChange={e => setDeliveryForm({...deliveryForm, neighborhood: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Código Postal</label>
                                                <input className="input-field" placeholder="Código Postal" inputMode="numeric" value={deliveryForm.zip} onChange={e => setDeliveryForm({...deliveryForm, zip: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Nombre completo</label>
                                                <input className="input-field" placeholder="Nombre completo" value={deliveryForm.fullName} onChange={e => setDeliveryForm({...deliveryForm, fullName: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Teléfono</label>
                                                <input className="input-field" placeholder="Teléfono" inputMode="tel" value={deliveryForm.phone} onChange={e => setDeliveryForm({...deliveryForm, phone: e.target.value})} />
                                            </div>
                                            <div className="md:col-span-2">
                                                <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Correo electrónico</label>
                                                <input className="input-field" placeholder="Correo electrónico" type="email" value={deliveryForm.email} onChange={e => setDeliveryForm({...deliveryForm, email: e.target.value})} />
                                            </div>
                                            <div className="md:col-span-2">
                                                <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Referencias del domicilio</label>
                                                <textarea className="input-field min-h-[120px] resize-none" placeholder="Referencias del domicilio" value={deliveryForm.references} onChange={e => setDeliveryForm({...deliveryForm, references: e.target.value})}></textarea>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}


                        {view === 'payment-method' && checkoutProducts.length > 0 && (
                            <div className="w-full max-w-4xl py-6 animate-slide checkout-screen">
                                <button onClick={resetAfterIncompletePayment} className="mb-6 text-[10px] font-black uppercase text-slate-400 hover:text-red-500">← Cancelar pago y volver al inicio</button>
                                <div className="card-glass checkout-card">
                                    <div className="bg-white border-b border-slate-100 px-6 py-5 checkout-header">
                                        <div className="checkout-title">
                                            <p className="text-[10px] text-red-500 font-black uppercase tracking-widest mb-1 checkout-product-label">{checkoutProducts.length > 1 ? 'Productos seleccionados' : 'Producto seleccionado'}: {checkoutProductNames}</p>
                                            <h1 className="text-2xl sm:text-3xl font-black tracking-tight">Método de pago</h1>
                                            <p className="text-[9px] font-bold text-slate-400 uppercase mt-1 checkout-id-label">ID{checkoutProducts.length > 1 ? 's' : ''} conservado{checkoutProducts.length > 1 ? 's' : ''}: {checkoutProductIdsLabel}</p>
                                        </div>
                                    </div>
                                    <div className="p-6 lg:p-8 space-y-5">
                                        <div className="bg-slate-50 rounded-2xl p-4 space-y-3">
                                            <p className="text-[9px] font-black text-slate-400 uppercase">Resumen de compra</p>
                                            {checkoutProducts.map(product => (
                                                <div key={product.id} className="flex items-center justify-between gap-3 text-sm font-bold checkout-summary-row">
                                                    <span className="text-slate-700">{product.name} <span className="text-[10px] text-slate-400 uppercase">x{Number(product.quantity || 0)} · unitario ${Number(product.unitPrice || product.price || 0).toFixed(2)}</span></span>
                                                    <span className="text-red-500 font-black">${getProductLineTotal(product, product.quantity).toFixed(2)}</span>
                                                </div>
                                            ))}
                                            <div className="flex items-center justify-between gap-3 text-sm font-bold border-t border-slate-200 pt-3">
                                                <span className="text-slate-700">Gastos de envio</span>
                                                <span className="text-red-500 font-black">${Number(checkoutShippingFee || 0).toFixed(2)}</span>
                                            </div>
                                        </div>
                                        <div className="grid md:grid-cols-2 gap-4">
                                            {[
                                                ['transfer', 'Transferencia bancaria', 'Queda Pendiente hasta que el administrador confirme el pago. Gastos de envio 150 pesos.']
                                            ].map(([value, title, desc]) => (
                                                <label key={value} className={`border-2 rounded-2xl p-5 cursor-pointer hover:border-red-200 transition-all bg-white ${selectedPaymentMethod === value ? 'border-red-400' : 'border-slate-100'}`}>
                                                    <div className="flex items-start gap-3">
                                                        <input type="radio" name="paymentMethod" className="mt-1" checked={selectedPaymentMethod === value} onChange={() => setSelectedPaymentMethod(value)} />
                                                        <div>
                                                            <p className="text-sm font-black text-slate-800">{title}</p>
                                                            <p className="text-[10px] font-bold text-slate-400 uppercase mt-1 leading-relaxed">{desc}</p>
                                                        </div>
                                                    </div>
                                                </label>
                                            ))}
                                        </div>

                                        {selectedPaymentMethod === 'transfer' && (
                                            <div className="bg-slate-50 rounded-2xl p-5 space-y-3">
                                                <p className="text-[9px] font-black text-slate-400 uppercase">Cuenta bancaria Banco Azteca</p>
                                                <p className="text-2xl font-black text-slate-900 break-all">{paymentSettings.bankAccount || 'Cuenta no configurada'}</p>
                                                <p className="text-[10px] font-bold text-slate-500 uppercase leading-relaxed">{PAYMENT_BANK_AZTECA_ORDER_TEXT}</p>
                                            </div>
                                        )}

                                        <div className="bg-slate-50 rounded-2xl p-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 checkout-submit-bar">
                                            <div>
                                                <p className="text-[9px] font-black text-slate-400 uppercase">Total</p>
                                                <p className="text-[10px] font-bold text-slate-400 uppercase">Productos: ${Number(checkoutSubtotal || 0).toFixed(2)} · Envío: ${Number(checkoutShippingFee || 0).toFixed(2)} · Unidades: {checkoutTotalQuantity}</p>
                                                <p className="text-3xl font-black text-red-500">${Number(checkoutTotal || 0).toFixed(2)}</p>
                                            </div>
                                            <button type="button" onClick={createPendingTransfer} disabled={orderSending || !paymentSettings.bankAccount} className="btn-primary h-12 disabled:opacity-50 disabled:cursor-not-allowed checkout-submit-button">{orderSending ? 'Registrando...' : 'Registrar transferencia pendiente'}</button>
                                        </div>
                                        <button type="button" onClick={resetAfterIncompletePayment} className="w-full text-[9px] font-black text-slate-400 uppercase hover:text-red-500">Cancelar método de pago y restablecer pantalla</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'admin' && (
                            <PanelControlUI.AdminPanel
                                Icons={Icons}
                                WalletUI={WalletUI}
                                UsersUI={UsersUI}
                                AdsManager={AdsManager}
                                fbase={fbase}
                                appId={appId}
                                sessionUser={sessionUser}
                                showAdminMenu={showAdminMenu}
                                setShowAdminMenu={setShowAdminMenu}
                                openAdminTracking={openAdminTracking}
                                openAdminSupport={openAdminSupport}
                                pkgForm={pkgForm}
                                setPkgForm={setPkgForm}
                                users={users}
                                saveDoc={saveDoc}
                                pkgs={pkgs}
                                deletePkg={deletePkg}
                                findProductByTracking={findProductByTracking}
                                emailSettings={emailSettings}
                                setEmailSettings={setEmailSettings}
                                saveEmailSettings={saveEmailSettings}
                                emailSaving={emailSaving}
                                paymentSettings={paymentSettings}
                                setPaymentSettings={setPaymentSettings}
                                savePaymentSettings={savePaymentSettings}
                                paymentSaving={paymentSaving}
                                walletSettings={walletSettings}
                                setWalletSettings={setWalletSettings}
                                saveWalletCommissionSettings={saveWalletCommissionSettings}
                                walletSettingsSaving={walletSettingsSaving}
                                wallets={wallets}
                                walletRechargeRows={walletRechargeRows}
                                approveWalletRechargeFromPanel={approveWalletRechargeFromPanel}
                                deleteWalletRechargeFromPanel={deleteWalletRechargeFromPanel}
                                walletRechargeActionId={walletRechargeActionId}
                                pendingSalesTransfers={pendingSalesTransfers}
                                transferTrackingDrafts={transferTrackingDrafts}
                                setTransferTrackingDrafts={setTransferTrackingDrafts}
                                assignTrackingToTransfer={assignTrackingToTransfer}
                                markTransferPaid={markTransferPaid}
                                deleteTransfer={deleteTransfer}
                                orderSending={orderSending}
                                productOptionsLines={productOptionsLines}
                                completedSales={completedSales}
                                deleteCompletedSale={deleteCompletedSale}
                                ads={ads}
                                editingProductId={editingProductId}
                                resetProductForm={resetProductForm}
                                handleProductSubmit={handleProductSubmit}
                                handleProductImagesSelect={handleProductImagesSelect}
                                productForm={productForm}
                                setProductForm={setProductForm}
                                productImageFiles={productImageFiles}
                                replaceExistingProductImage={replaceExistingProductImage}
                                removeExistingProductImage={removeExistingProductImage}
                                removeNewProductImage={removeNewProductImage}
                                PRODUCT_SIZE_OPTIONS={PRODUCT_SIZE_OPTIONS}
                                normalizeProductSizes={normalizeProductSizes}
                                normalizeProductColors={normalizeProductColors}
                                productUploading={productUploading}
                                controlProducts={controlProducts}
                                getProductGallery={getProductGallery}
                                editProduct={editProduct}
                                toggleProduct={toggleProduct}
                                deleteProduct={deleteProduct}
                                registeredUsersPage={registeredUsersPage}
                                REGISTERED_USERS_PAGE_SIZE={REGISTERED_USERS_PAGE_SIZE}
                                setRegisteredUsersPage={setRegisteredUsersPage}
                                editRegisteredUser={editRegisteredUser}
                                toggleUserBlocked={toggleUserBlocked}
                                deleteUser={deleteUser}
                                isUserBlocked={isUserBlocked}
                            />
                        )}


                        {view === 'admin-tracking' && (
                            <PanelControlUI.AdminTrackingPanel
                                setView={setView}
                                searchQuery={searchQuery}
                                runTrackingSearch={runTrackingSearch}
                                trackingNotFound={trackingNotFound}
                                trackingResult={trackingResult}
                                getProductGallery={getProductGallery}
                                productSizesText={productSizesText}
                                productColorsText={productColorsText}
                            />
                        )}


                        {(view === 'support' || view === 'admin-support') && (
                            <div className="w-full max-w-5xl py-8 animate-slide">
                                <button onClick={() => setView(view === 'admin-support' ? 'admin' : 'home')} className="mb-5 text-[10px] font-black uppercase text-slate-400 hover:text-red-500">← Volver</button>
                                <div className="card-glass overflow-hidden grid md:grid-cols-[280px_1fr] min-h-[620px]">
                                    {view === 'admin-support' && (
                                        <aside className="border-r border-slate-100 bg-slate-50 p-4 space-y-3">
                                            <h2 className="text-[10px] font-black uppercase tracking-widest text-slate-400">Chats de soporte</h2>
                                            <div className="space-y-2 max-h-[540px] overflow-y-auto pr-1">
                                                {supportChats.map(chat => (
                                                    <div key={chat.id || chat.chatId} className={`w-full p-3 rounded-2xl border text-[10px] font-bold ${((chat.id || chat.chatId) === activeSupportChatId) ? 'bg-white border-red-200' : 'bg-white/70 border-slate-100'}`}>
                                                        <button type="button" onClick={() => setActiveSupportChatId(chat.id || chat.chatId)} className="w-full text-left">
                                                            <p className="font-black text-slate-800 truncate">{chat.userEmail || chat.userId}</p>
                                                            <p className={`mt-1 uppercase text-[8px] font-black ${chat.status === 'closed' ? 'text-slate-300' : 'text-green-600'}`}>{chat.status === 'closed' ? 'Cerrado' : 'Activo'}</p>
                                                        </button>
                                                        <button type="button" onClick={(e) => { e.stopPropagation(); deleteSupportChat(chat); }} className="mt-2 w-full px-2 py-2 rounded-xl bg-red-50 text-red-500 hover:bg-red-500 hover:text-white text-[8px] font-black uppercase flex items-center justify-center gap-1"><Icons.Trash size={11} /> Eliminar</button>
                                                    </div>
                                                ))}
                                                {supportChats.length === 0 && <p className="text-[10px] font-bold text-slate-300 uppercase text-center py-8">Sin chats todavía</p>}
                                            </div>
                                        </aside>
                                    )}
                                    <section className={`${view === 'admin-support' ? '' : 'md:col-span-2'} flex flex-col bg-white`}>
                                        <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between gap-3">
                                            <div>
                                                <p className="text-[10px] text-red-500 font-black uppercase tracking-widest">Soporte Técnico</p>
                                                <h1 className="text-2xl font-black tracking-tight">Chat interno</h1>
                                            </div>
                                            {view === 'admin-support' && adminSelectedSupportChat && (
                                                <div className="flex items-center gap-2">
                                                    {adminSelectedSupportChat?.status !== 'closed' && (
                                                        <button onClick={() => closeSupportChat(adminSelectedSupportChat)} className="px-3 py-2 bg-green-50 text-green-600 rounded-xl text-[8px] font-black uppercase">Solucionado</button>
                                                    )}
                                                    <button onClick={() => deleteSupportChat(adminSelectedSupportChat)} className="px-3 py-2 bg-red-50 text-red-500 rounded-xl text-[8px] font-black uppercase flex items-center gap-1"><Icons.Trash size={11} /> Eliminar</button>
                                                </div>
                                            )}
                                        </div>
                                        <div className="flex-1 p-5 bg-slate-50 overflow-y-auto space-y-3 max-h-[460px]">
                                            {((view === 'admin-support' ? adminSelectedSupportChat : activeSupportChat)?.messages || []).map(msg => (
                                                <div key={msg.id} className={`flex ${msg.sender === 'admin' ? 'justify-end' : 'justify-start'}`}>
                                                    <div className={`max-w-[78%] rounded-2xl px-4 py-3 text-sm font-semibold ${msg.sender === 'admin' ? 'bg-red-500 text-white rounded-br-sm' : 'bg-white text-slate-700 rounded-bl-sm border border-slate-100'}`}>
                                                        <p>{msg.text}</p>
                                                        <p className={`text-[8px] font-black uppercase mt-2 ${msg.sender === 'admin' ? 'text-red-100' : 'text-slate-300'}`}>{msg.senderName} · {msg.createdAt ? new Date(msg.createdAt).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }) : ''}</p>
                                                    </div>
                                                </div>
                                            ))}
                                            {(((view === 'admin-support' ? adminSelectedSupportChat : activeSupportChat)?.messages || []).length === 0) && (
                                                <div className="h-full flex items-center justify-center text-center text-[10px] font-black text-slate-300 uppercase tracking-widest">Escribe un mensaje para iniciar soporte</div>
                                            )}
                                            {(view === 'admin-support' ? adminSelectedSupportChat : activeSupportChat)?.status === 'closed' && (
                                                <p className="text-center text-[10px] font-black text-slate-400 uppercase">Conversación cerrada</p>
                                            )}
                                        </div>
                                        <div className="p-4 border-t border-slate-100 flex gap-2">
                                            <input disabled={(view === 'admin-support' ? adminSelectedSupportChat : activeSupportChat)?.status === 'closed'} className="input-field" placeholder="Escribe tu mensaje..." value={supportInput} onChange={e => setSupportInput(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') sendSupportMessage(view === 'admin-support' ? 'admin' : 'user'); }} />
                                            <button disabled={(view === 'admin-support' ? adminSelectedSupportChat : activeSupportChat)?.status === 'closed'} onClick={() => sendSupportMessage(view === 'admin-support' ? 'admin' : 'user')} className="btn-primary disabled:opacity-50"><Icons.Send /> Enviar</button>
                                        </div>
                                    </section>
                                </div>
                            </div>
                        )}

                        {view === 'operator' && (
                            <div className="w-full max-w-5xl space-y-8 animate-slide">
                                <div className="flex justify-between items-start gap-4">
                                    <div>
                                        <p className="text-[10px] font-bold text-slate-400 uppercase">Panel de Usuario Registrado</p>
                                        <h1 className="text-3xl font-black uppercase tracking-tight">Acceso <span className="text-red-500">Usuario</span></h1>
                                    </div>
                                    <div className="relative">
                                        <button type="button" onClick={() => setShowUserMenu(!showUserMenu)} className="w-12 h-12 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-slate-600 hover:text-red-500 shadow-sm" aria-label="Abrir menú de usuario">
                                            <Icons.Menu />
                                        </button>
                                        {showUserMenu && (
                                            <div className="absolute right-0 top-14 w-56 bg-white border border-slate-100 rounded-2xl shadow-xl p-2 z-50 animate-slide">
                                                <button type="button" onClick={() => { if (!ensureAccountAllowed()) return; setShowUserMenu(false); document.getElementById('user-products-section')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }} className="w-full text-left px-4 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest text-slate-600 hover:bg-red-50 hover:text-red-600">Administración de Productos</button>
                                                <button type="button" onClick={() => { if (!ensureAccountAllowed()) return; setShowUserMenu(false); document.getElementById('user-sales-section')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }} className="w-full text-left px-4 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest text-slate-600 hover:bg-red-50 hover:text-red-600">Ventas Realizadas</button>
                                                <button type="button" onClick={() => { if (!ensureAccountAllowed()) return; setShowUserMenu(false); document.getElementById('wallet-movements-section')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }} className="w-full text-left px-4 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest text-slate-600 hover:bg-red-50 hover:text-red-600">Movimientos</button>
                                                <button type="button" onClick={openAssignmentsAccess} className="w-full text-left px-4 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest text-slate-600 hover:bg-red-50 hover:text-red-600">Mis Asignaciones</button>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <WalletUI.UserWalletCard
                                    user={sessionUser}
                                    wallet={currentUserWallet}
                                    rechargeAmount={walletRechargeAmount}
                                    onRechargeAmountChange={setWalletRechargeAmount}
                                    showRecharge={showWalletRecharge}
                                    onToggleRecharge={() => { if (!ensureAccountAllowed()) return; setShowWalletRecharge(prev => !prev); }}
                                    onCloseRecharge={() => { setShowWalletRecharge(false); setWalletRechargeAmount(''); }}
                                    rechargeProcessing={walletRechargeProcessing}
                                    settings={walletSettings}
                                    bankAccount={paymentSettings.bankAccount}
                                    onCreatePendingRecharge={createPendingWalletRechargeTransfer}
                                    blockedMessage={currentUserWalletBlockedMessage}
                                    userProductCount={currentUserProducts.filter(product => product.active !== false).length}
                                />

                                <WalletUI.WalletMovementsPanel movements={walletMovements} />

                                {renderUserProductsPanel()}

                                {assignmentsUnlocked ? (
                                    <>
                                        <div><h1 className="text-3xl font-black uppercase tracking-tight">Mis <span className="text-red-500">Asignaciones</span></h1><p className="text-[10px] font-bold text-slate-400 uppercase">Ruta Activa</p></div>
                                        <div className="space-y-4">
                                            {pkgs.filter(p => p.op === sessionUser.id).map(p => (
                                                <div key={p.id} className="card-glass p-6 space-y-6">
                                                    <div className="flex justify-between items-center"><h3 className="text-xl font-black text-red-600">#{p.id}</h3><span className="text-[9px] font-black uppercase text-slate-400">{p.o} → {p.d}</span></div>
                                                    <div className="grid grid-cols-2 gap-2">
                                                        {STEPS.map((s, i) => (
                                                            <button key={s} onClick={() => updateAssignedPackageStatus(p, s, i)} className={`p-3 rounded-xl text-[9px] font-black uppercase border-2 transition-all ${p.status === s ? 'bg-red-500 border-red-500 text-white shadow-lg' : 'border-slate-100 text-slate-400'}`}>{s}</button>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </>
                                ) : (
                                    <div className="card-glass p-8 text-center space-y-4">
                                        <div className="w-14 h-14 rounded-2xl bg-red-50 text-red-500 flex items-center justify-center mx-auto">
                                            <Icons.Menu size={22} />
                                        </div>
                                        <div>
                                            <h2 className="text-xl font-black uppercase tracking-tight">Asignaciones protegidas</h2>
                                            <p className="text-[10px] font-bold text-slate-400 uppercase mt-2 leading-relaxed">Abre el menú hamburguesa y selecciona Mis Asignaciones para validar la contraseña maestra.</p>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'login' && (
                            <div className="w-full max-w-sm py-20 animate-slide">
                                <div className="card-glass p-10 space-y-8">
                                    <h2 className="text-center text-xl font-black uppercase tracking-widest">Panel Staff</h2>
                                    <form onSubmit={handleLogin} className="space-y-4">
                                        <input required className="input-field" placeholder="CORREO ELECTRÓNICO" type="email" value={loginForm.email} onChange={e => setLoginForm({...loginForm, email: e.target.value})} />
                                        <input required type="password" className="input-field" placeholder="CONTRASEÑA" value={loginForm.p} onChange={e => setLoginForm({...loginForm, p: e.target.value})} />
                                        <button type="submit" className="w-full btn-primary h-12">Entrar</button>
                                        <button type="button" onClick={openRegisterUserModal} className="w-full btn-primary h-12">Registrar Usuario</button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </main>

                    {showAssignmentsPasswordModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-6">
                            <div className="card-glass max-w-sm w-full p-10 animate-slide">
                                <h2 className="text-sm font-black text-center uppercase mb-2">Acceso Protegido</h2>
                                <p className="text-[10px] font-bold text-slate-400 uppercase text-center mb-8 leading-relaxed">Ingresa la contraseña maestra del administrador central para abrir Mis Asignaciones. Al validarse, solo se guarda la autorización del usuario; la contraseña no se almacena.</p>
                                <form onSubmit={validateAssignmentsPassword} className="space-y-4">
                                    <input required autoFocus type="password" className="input-field" placeholder="CONTRASEÑA MAESTRA" value={assignmentsPassword} onChange={e => { setAssignmentsPassword(e.target.value); setAssignmentsPasswordError(''); }} />
                                    {assignmentsPasswordError && <p className="text-center text-[10px] font-black text-red-500 uppercase tracking-widest">{assignmentsPasswordError}</p>}
                                    <button disabled={assignmentsUnlocking} type="submit" className="w-full btn-primary h-12 disabled:opacity-50 disabled:cursor-not-allowed">{assignmentsUnlocking ? 'Validando...' : 'Validar acceso'}</button>
                                    <button disabled={assignmentsUnlocking} type="button" onClick={closeAssignmentsPasswordModal} className="w-full text-[9px] font-black text-slate-400 uppercase disabled:opacity-50">Cancelar</button>
                                </form>
                            </div>
                        </div>
                    )}

                    <UsersUI.RegisteredUserModal
                        isOpen={showUserModal}
                        editingRegisteredUserId={editingRegisteredUserId}
                        userForm={userForm}
                        setUserForm={setUserForm}
                        userRegistrationSaving={userRegistrationSaving}
                        onSubmit={registerUser}
                        onClose={closeRegisteredUserModal}
                    />
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
