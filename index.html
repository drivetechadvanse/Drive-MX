                    ['zip', 'El código postal es obligatorio.'],
                    ['fullName', 'El nombre completo es obligatorio.'],
                    ['phone', 'El teléfono es obligatorio.'],
                    ['email', 'El correo electrónico es obligatorio.'],
                    ['references', 'Las referencias del domicilio son obligatorias.']
                ];
                for (const [field, message] of requiredFields) {
                    if (!String(deliveryForm[field] || '').trim()) {
                        alert(message);
                        return false;
                    }
                }
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(deliveryForm.email.trim())) {
                    alert('Ingresa un correo electrónico válido.');
                    return false;
                }
                return true;
            };

            const resetDeliveryForm = () => {
                setDeliveryForm({ street: '', state: '', municipality: '', neighborhood: '', zip: '', fullName: '', phone: '', email: '', references: '' });
            };

            const handleDeliveryContinue = async () => {
                if (checkoutProducts.length === 0) {
                    alert('No se encontraron productos seleccionados.');
                    return;
                }
                if (!validateDeliveryForm()) return;
                if (!ensureCheckoutWalletsAllowed(checkoutProducts)) return;
                setSelectedPaymentMethod('paypal');
                setView('payment-method');
            };

            const findProductByTracking = (tracking) => {
                if (!tracking) return null;
                const orderProducts = Array.isArray(tracking.order?.products) ? tracking.order.products : [];
                const productId = tracking.productId || tracking.products?.[0]?.id || orderProducts[0]?.id || tracking.product?.id || tracking.order?.product?.id || '';
                return products.find(p => String(p.id) === String(productId)) || tracking.products?.[0] || orderProducts[0] || tracking.product || tracking.order?.product || null;
            };

            const normalizeTrackingCode = (value) => String(value || '').toUpperCase().trim();

            const buildPackageFromOrder = (transfer, trackingCode) => {
                const order = transfer?.order || {};
                const orderProducts = Array.isArray(order.products) && order.products.length > 0 ? order.products : (order.product ? [order.product] : []);
                const product = orderProducts[0] || {};
                const delivery = order.delivery || {};
                const address = [delivery.street, delivery.neighborhood, delivery.municipality, delivery.state, delivery.zip].filter(Boolean).join(', ');
                return {
                    id: trackingCode,
                    trackingNumber: trackingCode,
                    orderId: transfer?.id || transfer?.transferId || '',
                    transferId: transfer?.id || transfer?.transferId || '',
                    productId: orderProducts.map(item => item.id).filter(Boolean).join(', ') || product.id || '',
                    product: { ...product },
                    products: orderProducts.map(item => ({ ...item })),
                    orderTotal: orderProducts.reduce((total, item) => total + Number(item.price || 0), 0),
                    customer: {
                        fullName: delivery.fullName || transfer?.holderName || '',
                        phone: delivery.phone || '',
                        email: delivery.email || ''
                    },
                    delivery: { ...delivery },
                    o: 'DRIVE MX',
                    d: address || 'Dirección registrada',
                    op: '',
                    status: 'Recolectado',
                    currentStep: 0,
                    createdAt: Date.now(),
                    updatedAt: Date.now()
                };
            };

            const assignTrackingToTransfer = async (transfer) => {
                if (sessionUser?.role !== 'admin') return;
                const transferId = transfer?.id || transfer?.transferId;
                const code = normalizeTrackingCode(transferTrackingDrafts[transferId] || transfer?.trackingNumber || '');
                if (!code) { alert('Ingresa el número de guía.'); return; }
                const pkg = buildPackageFromOrder(transfer, code);
                await saveDoc('packages', code, pkg);
                await saveDoc('bank_transfers', transferId, { ...transfer, trackingNumber: code, packageId: code, updatedAt: Date.now(), trackingAssignedAt: Date.now(), trackingAssignedBy: sessionUser?.email || '' });
                setTransferTrackingDrafts(prev => ({ ...prev, [transferId]: '' }));
                alert('Guía asociada al pedido y producto correctamente.');
            };

            const runTrackingSearch = (value, notify = false) => {
                const productId = normalizeTrackingCode(value);
                setSearchQuery(value);
                if (!productId) {
                    setTrackingResult(null);
                    setTrackingNotFound(false);
                    return;
                }

                // Buscador independiente del Panel de Control:
                // busca SOLO publicaciones creadas y administradas desde el Panel de Control.
                // No consulta publicaciones de usuarios, envíos, guías, paquetes ni transferencias.
                const foundProduct = controlProducts.find(product => normalizeTrackingCode(product.id) === productId);
                setTrackingResult(foundProduct || null);
                setTrackingNotFound(!foundProduct);
                if (!foundProduct && notify) alert('No se encontró el producto');
            };

            const runGuideSearch = (value, notify = false) => {
                const code = normalizeTrackingCode(value);
                setGuideQuery(value);
                if (!code) {
                    setGuideResult(null);
                    setGuideNotFound(false);
                    return;
                }

                // Buscador independiente de guía:
                // busca SOLO envíos registrados en packages por número de guía.
                // No consulta productos ni altera el buscador de ID de producto.
                const foundGuide = pkgs.find(pkg => normalizeTrackingCode(pkg.id || pkg.trackingNumber) === code);
                setGuideResult(foundGuide || null);
                setGuideNotFound(!foundGuide);
                if (!foundGuide && notify) alert('No se encontró la guía');
            };

            const getTrackingStepIndex = (pkg) => {
                if (!pkg) return 0;
                const current = Number(pkg.currentStep);
                if (Number.isFinite(current)) return Math.max(0, Math.min(STEPS.length - 1, current));
                const status = String(pkg.status || '').toLowerCase();
                if (status.includes('entregado')) return 3;
                if (status.includes('camino')) return 2;
                if (status.includes('proces')) return 1;
                if (status.includes('recolect')) return 0;
                return 0;
            };

            const trackingStepLabel = (step) => step === 'Procesando' ? 'Procesado' : step;

            const TrackingStatusCard = ({ pkg }) => {
                const activeIndex = getTrackingStepIndex(pkg);

            return (
                    <div className="card-glass p-6 max-w-3xl mx-auto animate-slide space-y-5">
                        <div className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3">
                            <div>
                                <p className="text-[9px] font-black text-slate-400 uppercase mb-1">Número de guía</p>
                                <h2 className="text-3xl font-black text-red-600">#{pkg.id || pkg.trackingNumber}</h2>
                            </div>
                            <span className="px-3 py-2 bg-red-50 text-red-600 rounded-full text-[9px] font-black uppercase tracking-widest self-start">{trackingStepLabel(pkg.status || STEPS[activeIndex])}</span>
                        </div>
                        <div className="bg-slate-50 rounded-2xl p-4 grid sm:grid-cols-2 gap-4">
                            <div><p className="text-[8px] font-black text-slate-400 uppercase">Origen</p><p className="text-sm font-black text-slate-900 uppercase">{pkg.o || 'Origen pendiente'}</p></div>
                            <div><p className="text-[8px] font-black text-slate-400 uppercase">Destino</p><p className="text-sm font-black text-slate-900 uppercase">{pkg.d || 'Destino pendiente'}</p></div>
                            {findProductByTracking(pkg) && (
                                <div className="sm:col-span-2 border-t border-slate-200 pt-3">
                                    <p className="text-[8px] font-black text-slate-400 uppercase">Producto relacionado</p>
                                    <p className="text-sm font-black text-slate-900">{findProductByTracking(pkg)?.name || findProductByTracking(pkg)?.productName || 'Producto'}</p>
                                    <ProductOptionBadges product={findProductByTracking(pkg)} compact />
                                </div>
                            )}
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                            {STEPS.map((step, i) => (
                                <div key={step} className={`p-3 rounded-xl border-2 text-center ${i <= activeIndex ? 'bg-red-500 border-red-500 text-white' : 'bg-white border-slate-100 text-slate-300'}`}>
                                    <p className="text-[9px] font-black uppercase">{trackingStepLabel(step)}</p>
                                </div>
                            ))}
                        </div>
                        <p className="text-[9px] font-bold text-slate-300 uppercase text-center">La información se actualiza cuando el usuario cambia el estado del envío.</p>
                    </div>
                );
            };

            const getSupportUserId = () => sessionUser?.uid || sessionUser?.id || fbUser?.uid || 'local';
            const activeSupportChat = supportChats.find(c => c.id === activeSupportChatId) || null;
            const adminSelectedSupportChat = activeSupportChat || supportChats.find(c => c.status === 'open') || null;

            const createSupportChat = async (userId, userEmail = '') => {
                const id = `support_${userId}_${Date.now()}`;
                const chat = {
                    chatId: id,
                    userId,
                    userEmail,
                    status: 'open',
                    messages: [],
                    createdAt: Date.now(),
                    updatedAt: Date.now()
                };
                await saveDoc('support_chats', id, chat);
                setActiveSupportChatId(id);
                return chat;
            };

            const openSupportFromCover = async () => {
                const userId = getSupportUserId();
                const active = supportChats.find(c => c.userId === userId && c.status === 'open');
                if (active) setActiveSupportChatId(active.id || active.chatId);
                else await createSupportChat(userId, 'Usuario portada');
                setView('support');
            };

            const openAdminSupport = () => {
                const firstOpen = supportChats.find(c => c.status === 'open') || supportChats[0];
                setActiveSupportChatId(firstOpen?.id || firstOpen?.chatId || '');
                setShowAdminMenu(false);
                setView('admin-support');
            };

            const openAdminTracking = () => {
                setShowAdminMenu(false);
                setSearchQuery('');
                setTrackingResult(null);
                setTrackingNotFound(false);
                setView('admin-tracking');
            };

            const closeAssignmentsPasswordModal = () => {
                if (assignmentsUnlocking) return;
                setShowAssignmentsPasswordModal(false);
                setAssignmentsPassword('');
                setAssignmentsPasswordError('');
            };

            const openAssignmentsAccess = () => {
                if (!ensureAccountAllowed()) return;
                setShowUserMenu(false);
                setAssignmentsPassword('');
                setAssignmentsPasswordError('');
                if (assignmentsUnlocked || userHasAssignmentsAuthorization(getCurrentSessionProfile())) {
                    setAssignmentsUnlocked(true);
                    return;
                }
                setShowAssignmentsPasswordModal(true);
            };

            const validateAssignmentsPassword = async (e) => {
                e.preventDefault();
                if (!ensureAccountAllowed()) {
                    setAssignmentsPassword('');
                    return;
                }
                if (!assignmentsPassword) {
                    setAssignmentsPasswordError('Ingresa la contraseña maestra.');
                    return;
                }
                setAssignmentsUnlocking(true);
                setAssignmentsPasswordError('');
                try {
                    const secondaryAuth = getSecondaryAuth();
                    await fbase.signInWithEmailAndPassword(secondaryAuth, ADMIN_EMAIL, assignmentsPassword);
                    await fbase.signOut(secondaryAuth).catch(() => {});
                    await persistAssignmentsAuthorization();
                    setAssignmentsUnlocked(true);
                    setShowAssignmentsPasswordModal(false);
                    setAssignmentsPassword('');
                    setAssignmentsPasswordError('');
                } catch(err) {
                    console.error('Validar contraseña maestra de asignaciones:', err);
                    try { await fbase.signOut(getSecondaryAuth()); } catch(e) {}
                    setAssignmentsUnlocked(false);
                    setAssignmentsPassword('');
                    setAssignmentsPasswordError('Acceso denegado. Contraseña incorrecta.');
                } finally {
                    setAssignmentsUnlocking(false);
                }
            };

            const updateAssignedPackageStatus = async (pkg, status, currentStep) => {
                if (!ensureAccountAllowed()) return;
                if (!assignmentsUnlocked && !userHasAssignmentsAuthorization(getCurrentSessionProfile())) {
                    alert('Valida primero la contraseña maestra para acceder a Mis Asignaciones.');
                    return;
                }
                await saveDoc('packages', pkg.id, { ...pkg, status, currentStep });
            };

            const sendSupportMessage = async (role = 'user') => {
                if (sessionUser && sessionUser.role !== 'admin' && !ensureAccountAllowed()) return;
                const text = supportInput.trim();
                if (!text) return;
                let chat = role === 'admin' ? adminSelectedSupportChat : activeSupportChat;
                if (!chat && role !== 'admin') chat = await createSupportChat(getSupportUserId(), 'Usuario portada');
                if (!chat || chat.status === 'closed') return;
                const id = chat.id || chat.chatId;
                const message = {
                    id: `msg_${Date.now()}`,
                    text,
                    sender: role,
                    senderName: role === 'admin' ? 'Soporte Técnico' : 'Usuario',
                    createdAt: Date.now()
                };
                await saveDoc('support_chats', id, { ...chat, messages: [...(chat.messages || []), message], updatedAt: Date.now() });
                setActiveSupportChatId(id);
                setSupportInput('');
            };

            const closeSupportChat = async (chat) => {
                if (!chat) return;
                const id = chat.id || chat.chatId;
                await saveDoc('support_chats', id, { ...chat, status: 'closed', closedAt: Date.now(), updatedAt: Date.now(), closedBy: sessionUser?.email || 'admin' });
                const newChat = await createSupportChat(chat.userId || getSupportUserId(), chat.userEmail || 'Usuario portada');
                setActiveSupportChatId(newChat.chatId);
            };

            const deleteSupportChat = async (chat) => {
                if (!chat) return;
                const id = chat.id || chat.chatId;
                if (!id) return;
                if (!confirm('¿Eliminar esta conversación de soporte técnico?')) return;
                const nextChats = supportChats.filter(c => (c.id || c.chatId) !== id);
                setSupportChats(nextChats);
                writeLocal('driveMxSupportChats', nextChats);
                if ((activeSupportChatId || '') === id) {
                    setActiveSupportChatId(nextChats[0]?.id || nextChats[0]?.chatId || '');
                }
                try {
                    const db = fbase.getFirestore();
                    await fbase.deleteDoc(fbase.doc(db, 'artifacts', appId, 'public', 'data', 'support_chats', id));
                } catch(err) { console.error('Firestore borrar soporte:', err); }
            };


            const ProductOptionBadges = ({ product = {}, compact = false }) => {
                const sizes = normalizeProductSizes(product);
                const colors = normalizeProductColors(product);
                if (!sizes.length && !colors.length) return null;
                const chipClass = compact ? 'px-2 py-1 rounded-lg bg-white border border-slate-100 text-[8px] font-black uppercase text-slate-500' : 'px-3 py-1.5 rounded-full bg-slate-50 border border-slate-100 text-[9px] font-black uppercase text-slate-500';
                return (
                    <div className={compact ? 'mt-2 space-y-1.5' : 'space-y-2'}>
                        {sizes.length > 0 && (
                            <div className="flex flex-wrap items-center gap-1.5">
                                <span className="text-[8px] font-black uppercase text-slate-400">Tallas:</span>
                                {sizes.map(size => <span key={size} className={chipClass}>{size}</span>)}
                            </div>
                        )}
                        {colors.length > 0 && (
                            <div className="flex flex-wrap items-center gap-1.5">
                                <span className="text-[8px] font-black uppercase text-slate-400">Colores:</span>
                                {colors.map(color => <span key={color} className={chipClass}>{color}</span>)}
                            </div>
                        )}
                    </div>
                );
            };

            const ProductOptionsFormFields = ({ form, setForm }) => {
                const sizes = normalizeProductSizes(form);
                const colors = normalizeProductColors(form);
                return (
                    <div className="md:col-span-5 rounded-2xl bg-slate-50 border border-slate-100 p-4 space-y-4">
                        <div>
                            <p className="text-[9px] font-black uppercase text-slate-400 mb-2">Tallas opcionales</p>
                            <div className="flex flex-wrap gap-2">
                                {PRODUCT_SIZE_OPTIONS.map(size => (
                                    <label key={size} className={`px-3 py-2 rounded-xl border text-[9px] font-black uppercase cursor-pointer ${sizes.includes(size) ? 'bg-red-50 border-red-200 text-red-600' : 'bg-white border-slate-100 text-slate-500'}`}>
                                        <input type="checkbox" className="sr-only" checked={sizes.includes(size)} onChange={() => toggleFormSize(setForm, size)} />
                                        {size}
                                    </label>
                                ))}
                            </div>
                        </div>
                        <div>
                            <p className="text-[9px] font-black uppercase text-slate-400 mb-2">Colores opcionales</p>
                            <div className="flex gap-2">
                                <input type="text" className="input-field" placeholder="Capturar color manualmente" value={form.colorDraft || ''} onChange={e => updateFormColorDraft(setForm, e.target.value)} onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addFormColor(setForm); } }} />
                                <button type="button" onClick={() => addFormColor(setForm)} className="h-12 w-12 shrink-0 rounded-xl bg-red-500 text-white text-xl font-black hover:bg-red-600" aria-label="Agregar color">+</button>
                            </div>
                            {colors.length > 0 && (
                                <div className="flex flex-wrap gap-2 mt-3">
                                    {colors.map((color, index) => (
                                        <span key={`${color}_${index}`} className="inline-flex items-center gap-2 px-3 py-2 rounded-xl bg-white border border-slate-100 text-[9px] font-black uppercase text-slate-600">
                                            {color}
                                            <button type="button" onClick={() => removeFormColor(setForm, index)} className="text-red-500 text-xs leading-none" aria-label={`Eliminar color ${color}`}>×</button>
                                        </span>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const renderUserProductsPanel = () => (
                <>
                    <div className="card-glass overflow-hidden">
                        <div className="bg-slate-50 border-b border-slate-100 px-6 py-4">
                            <h2 className="text-[10px] font-black uppercase tracking-widest text-slate-400">Correo para notificaciones de venta</h2>
                            <p className="text-[9px] font-bold text-slate-300 uppercase mt-1">Este correo recibirá el aviso automático cuando una de tus publicaciones sea vendida</p>
                        </div>
                        <form onSubmit={saveSaleNotificationEmail} className="p-6 grid md:grid-cols-[1fr_auto] gap-3 items-end">
                            <div>
                                <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Correo para notificaciones de venta</label>
                                <input required type="email" className="input-field" placeholder="correo@ejemplo.com" value={saleNotificationEmail} onChange={e => setSaleNotificationEmail(e.target.value)} />
                            </div>
                            <button disabled={saleNotificationSaving} type="submit" className="btn-primary h-12 disabled:opacity-50 disabled:cursor-not-allowed">{saleNotificationSaving ? 'Guardando...' : 'Guardar correo'}</button>
                        </form>
                    </div>

                    <div id="user-sales-section" className="card-glass overflow-hidden">
                        <div className="bg-slate-50 border-b border-slate-100 px-6 py-4">
                            <h2 className="text-[10px] font-black uppercase tracking-widest text-slate-400">Ventas Realizadas</h2>
                            <p className="text-[9px] font-bold text-slate-300 uppercase mt-1">Historial individual de productos vendidos de este usuario</p>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left">
                                <thead className="bg-white border-b border-slate-50">
                                    <tr className="text-[8px] font-black uppercase text-slate-400">
                                        <th className="px-6 py-3">Nombre del producto</th>
                                        <th className="px-6 py-3">Precio del producto</th>
                                        <th className="px-6 py-3">Fecha de venta</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-50">
                                    {currentUserSales.map(sale => (
                                        <tr key={sale.id || sale.saleId} className="text-[10px] font-bold text-slate-600">
                                            <td className="px-6 py-4 font-black text-slate-800">{sale.productName || sale.name || sale.productId || '-'}<ProductOptionBadges product={{ sizes: sale.productSizes, tallas: sale.productTallas, colors: sale.productColors, colores: sale.productColores }} compact /></td>
                                            <td className="px-6 py-4 text-red-600 font-black">${Number(sale.productCost || sale.productPrice || sale.price || 0).toFixed(2)}</td>
                                            <td className="px-6 py-4">{(sale.soldAt || sale.createdAt) ? new Date(sale.soldAt || sale.createdAt).toLocaleString('es-MX') : '-'}</td>
                                        </tr>
                                    ))}
                                    {currentUserSales.length === 0 && (
                                        <tr><td colSpan="3" className="px-6 py-8 text-center text-[10px] font-bold text-slate-300 uppercase">Aún no tienes ventas realizadas registradas</td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div id="user-products-section" className="card-glass overflow-hidden">
                        <div className="bg-slate-50 border-b border-slate-100 px-6 py-4 flex items-center justify-between gap-3">
                            <div>
                                <h2 className="text-[10px] font-black uppercase tracking-widest text-slate-400">Administración de Productos</h2>
                                <p className="text-[9px] font-bold text-slate-300 uppercase mt-1">Administra únicamente tus publicaciones; las activas se muestran en la portada principal</p>
                            </div>
                            {editingUserProductId && <button onClick={resetUserProductForm} className="text-[9px] font-black text-slate-400 uppercase">Cancelar edición</button>}
                        </div>
                        <div className="p-6 border-b border-slate-50">
                            <form onSubmit={handleUserProductSubmit} className="grid md:grid-cols-5 gap-3">
                                <label className="md:col-span-5 bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl p-4 cursor-pointer hover:border-red-200 transition-all">
                                    <input type="file" accept="image/*" multiple className="hidden" onChange={handleUserProductImagesSelect} />
                                    <div className="flex items-center justify-between gap-4 flex-wrap">
                                        <div>
                                            <p className="text-[10px] font-black uppercase text-slate-600">Fotografías del producto</p>
                                            <p className="text-[9px] font-bold text-slate-400 uppercase mt-1">Máximo 5 imágenes JPG, PNG o WebP asociadas al mismo ID</p>
                                        </div>
                                        <span className="px-3 py-2 bg-white rounded-xl text-[9px] font-black text-slate-400 uppercase">{(userProductForm.images || []).length + userProductImageFiles.length}/5 fotos</span>
                                    </div>
                                </label>

                                {((userProductForm.images || []).length > 0 || userProductImageFiles.length > 0) && (
                                    <div className="md:col-span-5 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
                                        {(userProductForm.images || []).map((img, index) => (
                                            <div key={img + index} className="relative rounded-2xl overflow-hidden bg-slate-100 border border-slate-100 group">
                                                <img src={img} alt={`Foto ${index + 1}`} className="w-full aspect-square object-cover" />
                                                <div className="absolute inset-x-2 bottom-2 flex gap-1">
                                                    <label className="flex-1 text-center bg-white/90 rounded-lg px-2 py-1 text-[7px] font-black uppercase cursor-pointer">
                                                        Reemplazar
                                                        <input type="file" accept="image/*" className="hidden" onChange={(e) => replaceExistingUserProductImage(index, e)} />
                                                    </label>
                                                    <button type="button" onClick={() => removeExistingUserProductImage(index)} className="flex-1 bg-red-500 text-white rounded-lg px-2 py-1 text-[7px] font-black uppercase">Eliminar</button>
                                                </div>
                                            </div>
                                        ))}
                                        {userProductImageFiles.map((item, index) => (
                                            <div key={item.preview} className="relative rounded-2xl overflow-hidden bg-slate-100 border border-dashed border-red-200">
                                                <img src={item.preview} alt={`Nueva foto ${index + 1}`} className="w-full aspect-square object-cover" />
                                                <button type="button" onClick={() => removeNewUserProductImage(index)} className="absolute inset-x-2 bottom-2 bg-red-500 text-white rounded-lg px-2 py-1 text-[7px] font-black uppercase">Quitar</button>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                <input required className="input-field md:col-span-2" placeholder="NOMBRE" value={userProductForm.name} onChange={e => setUserProductForm({...userProductForm, name: e.target.value})} />
                                <input required type="number" min="0" step="0.01" className="input-field" placeholder="PRECIO" value={userProductForm.price} onChange={e => setUserProductForm({...userProductForm, price: e.target.value})} />
                                <input required type="number" min="0" step="1" className="input-field" placeholder="INVENTARIO" value={userProductForm.stock} onChange={e => setUserProductForm({...userProductForm, stock: e.target.value})} />
                                <label className="flex items-center gap-2 text-[10px] font-black uppercase text-slate-500 bg-slate-50 rounded-xl px-4 py-3">
                                    <input type="checkbox" checked={userProductForm.active} onChange={e => setUserProductForm({...userProductForm, active: e.target.checked})} />
                                    Activo
                                </label>
                                <ProductOptionsFormFields form={userProductForm} setForm={setUserProductForm} />
                                <textarea className="input-field md:col-span-5 min-h-[90px] resize-y" placeholder="DESCRIPCIÓN" value={userProductForm.description} onChange={e => setUserProductForm({...userProductForm, description: e.target.value})}></textarea>
                                <textarea className="input-field md:col-span-5 min-h-[90px] resize-y" placeholder="ESPECIFICACIONES" value={userProductForm.specifications} onChange={e => setUserProductForm({...userProductForm, specifications: e.target.value})}></textarea>
                                <button disabled={userProductUploading} type="submit" className="md:col-span-5 btn-primary h-12 disabled:opacity-50 disabled:cursor-not-allowed">{userProductUploading ? 'Guardando...' : (editingUserProductId ? 'Guardar Cambios' : 'Agregar Producto')}</button>
                            </form>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left">
                                <thead className="bg-white border-b border-slate-50">
                                    <tr className="text-[8px] font-black uppercase text-slate-400">
                                        <th className="px-6 py-3">Foto</th>
                                        <th className="px-6 py-3">Producto</th>
                                        <th className="px-6 py-3">Precio</th>
                                        <th className="px-6 py-3">Inventario</th>
                                        <th className="px-6 py-3">Estado</th>
                                        <th className="px-6 py-3 text-right">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-50">
                                    {currentUserProducts.map(product => (
                                        <tr key={product.id} className="text-[10px] font-bold text-slate-600">
                                            <td className="px-6 py-4">
                                                <div className="w-12 h-12 rounded-xl bg-slate-100 overflow-hidden">
                                                    {getProductGallery(product)[0] ? <img src={getProductGallery(product)[0]} alt={product.name} className="w-full h-full object-cover" /> : null}
                                                </div>
                                            </td>
                                            <td className="px-6 py-4"><p className="font-black text-slate-800">{product.name}</p><p className="font-mono text-[8px] text-slate-400">{product.id}</p><ProductOptionBadges product={product} compact /></td>
                                            <td className="px-6 py-4 text-red-600 font-black">${Number(product.price || 0).toFixed(2)}</td>
                                            <td className="px-6 py-4">{Number(product.stock || 0)}</td>
                                            <td className="px-6 py-4"><span className={`px-2 py-1 rounded-full text-[8px] uppercase ${product.active !== false ? 'bg-green-50 text-green-600' : 'bg-slate-100 text-slate-400'}`}>{product.active !== false ? 'Activo' : 'Inactivo'}</span></td>
                                            <td className="px-6 py-4 text-right">
                                                <div className="flex justify-end gap-2 flex-wrap">
                                                    <button onClick={() => editUserProduct(product)} className="px-2 py-1 bg-slate-100 rounded-lg text-[8px] font-black uppercase">Editar</button>
                                                    <button onClick={() => toggleUserProduct(product)} className="px-2 py-1 bg-slate-100 rounded-lg text-[8px] font-black uppercase">{product.active !== false ? 'Desactivar' : 'Activar'}</button>
                                                    <button onClick={() => deleteUserProduct(product)} className="text-slate-300 hover:text-red-500"><Icons.Trash /></button>
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                    {currentUserProducts.length === 0 && (
                                        <tr><td colSpan="6" className="px-6 py-8 text-center text-[10px] font-bold text-slate-300 uppercase">Aún no tienes publicaciones registradas</td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </>
            );

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between sticky top-0 z-50">
                        <div className="flex items-center gap-3 cursor-pointer" onClick={resetPublicFlow}>
                            <div className="w-9 h-9 bg-red-500 rounded-xl flex items-center justify-center text-white shadow-lg shadow-red-100">
                                <Icons.Truck size={18} />
                            </div>
                        </div>
                        {sessionUser ? (
                            <div className="flex items-center gap-4">
                                <div className="text-right hidden sm:block">
                                    <p className="text-[10px] font-bold leading-none">{sessionUser.name}</p>
                                    <p className="text-[8px] font-black text-red-500 uppercase">{sessionUser.role}</p>
                                </div>
                                <button onClick={handleLogout} className="p-2 text-slate-400"><Icons.LogOut /></button>
                            </div>
                        ) : (
                            <div className="flex items-center gap-3">
                                <button type="button" onClick={() => { setIsCartOpen(true); }} className="relative w-11 h-11 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center hover:bg-red-50 hover:text-red-600" aria-label="Abrir carrito">
                                    <Icons.Cart size={19} />
                                    {cartItems.length > 0 && <span className="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[9px] font-black flex items-center justify-center">{cartItems.length}</span>}
                                </button>
                                <button onClick={openSupportFromCover} className="px-3 py-2 bg-slate-100 text-slate-600 rounded-xl text-[9px] font-black uppercase tracking-widest hover:bg-red-50 hover:text-red-600">Soporte Técnico</button>
                                <button onClick={() => { resetPublicFlow(); setLoginForm({ email: '', p: '' }); setView('login'); }} className="text-[9px] font-black uppercase text-slate-400 tracking-widest">Acceso Staff</button>
                            </div>
                        )}
                    </header>

                    {isCartOpen && (
                        <div className="fixed inset-0 z-[80] bg-slate-900/40 backdrop-blur-sm flex items-start justify-center p-4 sm:p-6">
                            <div className="w-full max-w-md bg-white rounded-[1.5rem] shadow-2xl border border-slate-100 overflow-hidden animate-slide mt-16">
                                <div className="bg-slate-50 border-b border-slate-100 px-5 py-4 flex items-center justify-between gap-3">
                                    <div>
                                        <p className="text-[9px] text-red-500 font-black uppercase tracking-widest">Carrito de compra</p>
                                        <h2 className="text-xl font-black tracking-tight">Productos seleccionados</h2>
                                        <p className="text-[9px] font-bold text-slate-400 uppercase mt-1">Máximo {CART_MAX_ITEMS} productos · se limpia automáticamente en {Math.round(CART_TTL_MS / 60000)} minutos</p>
                                    </div>
                                    <button type="button" onClick={() => setIsCartOpen(false)} className="w-9 h-9 rounded-xl bg-white text-slate-400 hover:text-red-500 font-black">×</button>
                                </div>

                                <div className="p-5 space-y-4">
                                    {cartProducts.length === 0 ? (
                                        <div className="text-center py-8 bg-slate-50 rounded-2xl">
                                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Tu carrito está vacío</p>
                                            <p className="text-[10px] font-bold text-slate-300 uppercase mt-1">Agrega productos desde el detalle de cada publicación</p>
                                        </div>
                                    ) : (
                                        <div className="space-y-3">
                                            {cartProducts.map(product => (
                                                <div key={product.id} className="flex items-center justify-between gap-3 bg-slate-50 rounded-2xl p-3">
                                                    <div className="min-w-0">
                                                        <p className="text-sm font-black text-slate-900 truncate">{product.name}</p>
                                                        <p className="text-[9px] font-bold text-slate-400 uppercase">ID: {product.id}</p>
                                                        <ProductOptionBadges product={product} compact />
                                                    </div>
                                                    <div className="text-right shrink-0">
                                                        <p className="text-sm font-black text-red-500">${Number(product.price || 0).toFixed(2)}</p>
                                                        <button type="button" onClick={() => removeProductFromCart(product.id)} className="text-[8px] font-black uppercase text-slate-300 hover:text-red-500">Quitar</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    <div className="bg-white border border-slate-100 rounded-2xl p-4 flex items-center justify-between gap-4">
                                        <div>
                                            <p className="text-[9px] font-black text-slate-400 uppercase">Total acumulado</p>
                                            <p className="text-[9px] font-bold text-slate-300 uppercase">{cartProducts.length} producto{cartProducts.length === 1 ? '' : 's'}</p>
                                        </div>
                                        <p className="text-2xl font-black text-red-500">${cartProducts.reduce((total, product) => total + Number(product.price || 0), 0).toFixed(2)}</p>
                                    </div>

                                    <button type="button" onClick={startCartCheckout} disabled={cartProducts.length === 0} className="btn-primary w-full h-12 disabled:opacity-50 disabled:cursor-not-allowed">Quiero comprar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="flex-grow p-6 flex flex-col items-center">
                        {view === 'home' && (
                            <div className="w-full max-w-6xl py-10 space-y-8 animate-slide">
                                <div className="text-center max-w-xl mx-auto">
                                    <h1 className="text-4xl font-black text-slate-900 tracking-tight mb-2">Productos <span className="text-red-500">Drive MX</span></h1>
                                    <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Portada de productos</p>
                                </div>

                                    <div className="w-full mt-6 animate-slide space-y-10">
                                        <div className="max-w-xl mx-auto">
                                            <img src="repartidora.png" alt="Drive MX" className="w-full h-auto" />
                                        </div>

                                        <section className="card-glass p-6 max-w-3xl mx-auto space-y-4">
                                            <div className="text-center">
                                                <p className="text-[10px] text-red-500 font-black uppercase tracking-widest">Consultar número de guía</p>
                                                <h2 className="text-2xl font-black tracking-tight">Rastrea tu envío</h2>
                                                <p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1">Origen, destino y estado actualizado por el usuario</p>
                                            </div>
                                            <div className="bg-slate-50 p-2 rounded-2xl border-2 border-slate-100 flex gap-2">
                                                <input className="flex-grow bg-transparent px-4 text-sm font-bold uppercase outline-none" placeholder="INGRESA TU NÚMERO DE GUÍA" value={guideQuery} onChange={e => runGuideSearch(e.target.value, false)} />
                                                <button onClick={() => runGuideSearch(guideQuery, true)} className="btn-primary">Consultar</button>
                                            </div>
                                            {guideNotFound && <p className="text-center text-[10px] font-black text-red-500 uppercase tracking-widest">No se encontró la guía</p>}
                                            {!guideResult && !guideNotFound && <p className="text-center text-[10px] font-black text-slate-300 uppercase tracking-widest">Ingresa el número de guía registrado en Nuevo Envío</p>}
                                            {guideResult && <TrackingStatusCard pkg={guideResult} />}
                                        </section>

                                        {activeProducts.length > 0 && (
                                            <section className="w-full">
                                                <div className="flex items-end justify-between gap-4 mb-5">
                                                    <div>
                                                        <p className="text-[10px] text-red-500 font-black uppercase tracking-widest">Inventario disponible</p>
                                                        <h2 className="text-2xl font-black tracking-tight">Productos <span className="text-red-500">Drive MX</span></h2>
                                                    </div>
                                                    <p className="hidden sm:block text-[9px] font-bold text-slate-400 uppercase tracking-widest">Actualizado automáticamente</p>
                                                </div>
                                                <div className="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                                                    {activeProducts.map(product => (
                                                        <article key={product.id} onClick={() => { setSelectedProductId(product.id); setCurrentImageIndex(0); setView('product-detail'); }} className="bg-white rounded-[1.35rem] border border-slate-100 overflow-hidden shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-200 cursor-pointer">
                                                            <div className="aspect-[4/3] bg-slate-100 overflow-hidden">
                                                                {getProductGallery(product)[0] ? (
                                                                    <img src={getProductGallery(product)[0]} alt={product.name} className="w-full h-full object-cover" />
                                                                ) : (
                                                                    <div className="w-full h-full flex items-center justify-center text-[10px] font-black text-slate-300 uppercase tracking-widest">Sin foto</div>
                                                                )}
                                                            </div>
                                                            <div className="p-5 space-y-3">
                                                                <div>
                                                                    <h3 className="text-sm font-black text-slate-900 leading-tight">{product.name}</h3>
                                                                    <p className="text-[9px] font-bold text-slate-400 uppercase mt-1">ID: {product.id}</p>
                                                                </div>
                                                                <div className="flex items-center justify-between gap-3">
                                                                    <p className="text-xl font-black text-red-500">${Number(product.price || 0).toFixed(2)}</p>
                                                                    <span className="px-3 py-1 bg-slate-50 rounded-full text-[9px] font-black text-slate-500 uppercase">Stock: {Number(product.stock || 0)}</span>
                                                                </div>
                                                            </div>
                                                        </article>
                                                    ))}
                                                </div>
                                            </section>
                                        )}
                                    </div>
                                
                            </div>
                        )}

                        {view === 'product-detail' && selectedProduct && (
                            <div className="w-full max-w-6xl py-6 animate-slide">
                                <button onClick={resetPublicFlow} className="mb-6 text-[10px] font-black uppercase text-slate-400 hover:text-red-500">← Volver a productos</button>
                                <div className="grid lg:grid-cols-2 gap-8 items-start">
                                    <div className="card-glass p-4 space-y-4">
                                        <div className="relative aspect-square bg-slate-100 rounded-[1.5rem] overflow-hidden flex items-center justify-center">
                                            {selectedMainImage ? (
                                                <img src={selectedMainImage} alt={selectedProduct.name} className="w-full h-full object-cover" />
                                            ) : (
                                                <div className="text-[10px] font-black text-slate-300 uppercase tracking-widest">Sin fotografías</div>
                                            )}
                                            {selectedGallery.length > 1 && (
                                                <>
                                                    <button onClick={() => setCurrentImageIndex((currentImageIndex - 1 + selectedGallery.length) % selectedGallery.length)} className="absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/90 shadow flex items-center justify-center text-slate-700 hover:text-red-500"><Icons.ChevronLeft /></button>
                                                    <button onClick={() => setCurrentImageIndex((currentImageIndex + 1) % selectedGallery.length)} className="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-white/90 shadow flex items-center justify-center text-slate-700 hover:text-red-500"><Icons.ChevronRight /></button>
                                                </>
                                            )}
                                        </div>
                                        {selectedGallery.length > 0 && (
                                            <div className="grid grid-cols-5 gap-3">
                                                {selectedGallery.map((img, i) => (
                                                    <button key={img + i} onClick={() => setCurrentImageIndex(i)} className={`aspect-square rounded-xl overflow-hidden border-2 bg-slate-100 ${currentImageIndex === i ? 'border-red-500' : 'border-transparent'}`}>
                                                        <img src={img} alt={`${selectedProduct.name} ${i+1}`} className="w-full h-full object-cover" />
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    <div className="card-glass p-8 lg:p-10 space-y-7">
                                        <div>
                                            <p className="text-[10px] text-red-500 font-black uppercase tracking-widest mb-2">Detalle del producto</p>
                                            <h1 className="text-3xl sm:text-4xl font-black tracking-tight leading-tight">{selectedProduct.name}</h1>
                                            <p className="text-[9px] font-bold text-slate-400 uppercase mt-2">ID: {selectedProduct.id}</p>
                                        </div>

                                        <div className="flex flex-wrap items-center gap-4">
                                            <p className="text-4xl font-black text-red-500">${Number(selectedProduct.price || 0).toFixed(2)}</p>
                                            <span className="px-4 py-2 bg-slate-50 rounded-full text-[10px] font-black text-slate-500 uppercase">Disponibles: {Number(selectedProduct.stock || 0)}</span>
                                        </div>

                                        {(normalizeProductSizes(selectedProduct).length > 0 || normalizeProductColors(selectedProduct).length > 0) && (
                                            <div className="space-y-3">
                                                <h2 className="text-[10px] font-black uppercase tracking-widest text-slate-400">Tallas y colores</h2>
                                                <ProductOptionBadges product={selectedProduct} />
                                            </div>
                                        )}

                                        <div className="space-y-3">
                                            <h2 className="text-[10px] font-black uppercase tracking-widest text-slate-400">Descripción</h2>
                                            <p className="text-sm font-semibold text-slate-600 leading-relaxed whitespace-pre-line">{selectedProduct.description || 'Sin descripción registrada.'}</p>
                                        </div>

                                        <div className="space-y-3">
                                            <h2 className="text-[10px] font-black uppercase tracking-widest text-slate-400">Especificaciones</h2>
                                            <p className="text-sm font-semibold text-slate-600 leading-relaxed whitespace-pre-line">{selectedProduct.specifications || 'Sin especificaciones registradas.'}</p>
                                        </div>

                                        <div className="flex flex-col sm:flex-row gap-3">
                                            <button type="button" onClick={() => startSingleProductCheckout(selectedProduct)} className="btn-primary w-full sm:w-auto h-12">Comprar</button>
                                            <button type="button" onClick={() => addProductToCart(selectedProduct)} className="w-full sm:w-auto h-12 px-6 rounded-xl border-2 border-red-100 bg-red-50 text-red-600 text-[10px] font-black uppercase tracking-widest hover:bg-red-500 hover:text-white transition-all">{isProductInCart(selectedProduct.id) ? 'En el carrito' : 'Agregar al carrito'}</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'delivery-data' && checkoutProducts.length > 0 && (
                            <div className="w-full max-w-5xl py-6 animate-slide">
                                <button onClick={() => { resetDeliveryForm(); if (checkoutProductIds.length > 0) { setView('home'); setIsCartOpen(true); } else { setView('product-detail'); } }} className="mb-6 text-[10px] font-black uppercase text-slate-400 hover:text-red-500">← {checkoutProductIds.length > 0 ? 'Volver al carrito' : 'Volver al detalle'}</button>
                                <div className="card-glass overflow-hidden">
                                    <div className="bg-white border-b border-slate-100 px-6 py-5 flex items-center justify-between gap-4">
                                        <div>
                                            <p className="text-[10px] text-red-500 font-black uppercase tracking-widest mb-1">{checkoutProducts.length > 1 ? 'Productos seleccionados' : 'Producto seleccionado'}: {checkoutProductNames}</p>
                                            <h1 className="text-2xl sm:text-3xl font-black tracking-tight">Datos de entrega</h1>
                                            <p className="text-[9px] font-bold text-slate-400 uppercase mt-1">ID{checkoutProducts.length > 1 ? 's' : ''} conservado{checkoutProducts.length > 1 ? 's' : ''}: {checkoutProductIdsLabel}</p>
                                        </div>
                                        <div className="flex items-center gap-3 shrink-0">
                                            <button type="button" onClick={resetPublicFlow} className="text-[9px] font-black uppercase text-slate-400 hover:text-red-500">Cancelar</button>
                                            <button type="button" onClick={handleDeliveryContinue} disabled={orderSending} className="btn-primary h-11 disabled:opacity-50 disabled:cursor-not-allowed">{orderSending ? 'Procesando...' : 'Continuar'}</button>
                                        </div>
                                    </div>

                                    <form onSubmit={(e) => { e.preventDefault(); handleDeliveryContinue(); }} className="p-6 lg:p-8 space-y-6">
                                        <div className="bg-slate-50 rounded-2xl p-4 space-y-3">
                                            <div className="flex items-center justify-between gap-4">
                                                <p className="text-[9px] font-black text-slate-400 uppercase">Resumen de compra</p>
                                                <p className="text-[9px] font-black text-red-500 uppercase">{checkoutProducts.length}/{CART_MAX_ITEMS} productos</p>
                                            </div>
                                            {checkoutProducts.map(product => (
                                                <div key={product.id} className="flex items-center justify-between gap-3 text-sm font-bold">
                                                    <div className="text-slate-700 min-w-0"><span>{product.name}</span><ProductOptionBadges product={product} compact /></div>
                                                    <span className="text-red-500 font-black">${Number(product.price || 0).toFixed(2)}</span>
                                                </div>
                                            ))}
                                            <div className="border-t border-slate-200 pt-3 flex items-center justify-between">
                                                <span className="text-[9px] font-black text-slate-400 uppercase">Total</span>
                                                <span className="text-xl font-black text-red-500">${Number(checkoutTotal || 0).toFixed(2)}</span>
                                            </div>
                                        </div>
                                        <div className="grid md:grid-cols-2 gap-4">
                                            <div className="md:col-span-2">
                                                <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Calle</label>
                                                <input className="input-field" placeholder="Calle y número" value={deliveryForm.street} onChange={e => setDeliveryForm({...deliveryForm, street: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Estado</label>
                                                <input className="input-field" placeholder="Estado" value={deliveryForm.state} onChange={e => setDeliveryForm({...deliveryForm, state: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Municipio</label>
                                                <input className="input-field" placeholder="Municipio" value={deliveryForm.municipality} onChange={e => setDeliveryForm({...deliveryForm, municipality: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Colonia</label>
                                                <input className="input-field" placeholder="Colonia" value={deliveryForm.neighborhood} onChange={e => setDeliveryForm({...deliveryForm, neighborhood: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Código Postal</label>
                                                <input className="input-field" placeholder="Código Postal" inputMode="numeric" value={deliveryForm.zip} onChange={e => setDeliveryForm({...deliveryForm, zip: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Nombre completo</label>
                                                <input className="input-field" placeholder="Nombre completo" value={deliveryForm.fullName} onChange={e => setDeliveryForm({...deliveryForm, fullName: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Teléfono</label>
                                                <input className="input-field" placeholder="Teléfono" inputMode="tel" value={deliveryForm.phone} onChange={e => setDeliveryForm({...deliveryForm, phone: e.target.value})} />
                                            </div>
                                            <div className="md:col-span-2">
                                                <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Correo electrónico</label>
                                                <input className="input-field" placeholder="Correo electrónico" type="email" value={deliveryForm.email} onChange={e => setDeliveryForm({...deliveryForm, email: e.target.value})} />
                                            </div>
                                            <div className="md:col-span-2">
                                                <label className="block text-[9px] font-black uppercase text-slate-400 mb-2">Referencias del domicilio</label>
                                                <textarea className="input-field min-h-[120px] resize-none" placeholder="Referencias del domicilio" value={deliveryForm.references} onChange={e => setDeliveryForm({...deliveryForm, references: e.target.value})}></textarea>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}


                        {view === 'payment-method' && checkoutProducts.length > 0 && (
                            <div className="w-full max-w-4xl py-6 animate-slide">
                                <button onClick={resetAfterIncompletePayment} className="mb-6 text-[10px] font-black uppercase text-slate-400 hover:text-red-500">← Cancelar pago y volver al inicio</button>
                                <div className="card-glass overflow-hidden">
                                    <div className="bg-white border-b border-slate-100 px-6 py-5">
                                        <p className="text-[10px] text-red-500 font-black uppercase tracking-widest mb-1">{checkoutProducts.length > 1 ? 'Productos seleccionados' : 'Producto seleccionado'}: {checkoutProductNames}</p>
                                        <h1 className="text-2xl sm:text-3xl font-black tracking-tight">Método de pago</h1>

                                            </div>

                                                                <td className="px-6 py-4"><p className="font-black text-slate-800">{product.name}</p><p className="font-mono text-[8px] text-slate-400">{product.id}</p><ProductOptionBadges product={product} compact /></td>

                                                                <td className="px-6 py-4">{Number(product.stock || 0)}</td>

                                                            <tr><td colSpan="6" className="px-6 py-8 text-center text-[10px] font-bold text-slate-300 uppercase">Aún no hay productos registrados</td></tr>

                                                                <div className="min-w-0">

                                                        </div>
                                                    </article>

                                            </div>
                                        </div>
                                    </div>

                                        <button onClick={() => runTrackingSearch(searchQuery, true)} className="btn-primary">Buscar</button>

                                        return (
                                            <div className="card-glass p-6 max-w-3xl mx-auto animate-slide">
                                                <div className="flex flex-col sm:flex-row gap-5">
                                                    <div className="w-full sm:w-44 h-44 rounded-2xl bg-slate-100 overflow-hidden shrink-0">
                                                        {productImage ? <img src={productImage} alt={product?.name || 'Producto'} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-[10px] font-black text-slate-300 uppercase">Sin foto</div>}
                                                    </div>
                                                    <div className="flex-grow space-y-4">
                                                        <div>
                                                            <p className="text-[9px] font-black text-slate-400 uppercase mb-1">ID (Guías de envío Noo)</p>
                                                            <h2 className="text-3xl font-black text-red-600">#{product.id}</h2>
                                                        </div>
                                                        <div className="bg-slate-50 rounded-2xl p-4 grid sm:grid-cols-2 gap-4">
                                                            <div><p className="text-[8px] font-black text-slate-400 uppercase">Foto</p><p className="text-sm font-black text-slate-900">{productImage ? 'Foto disponible' : 'Sin foto'}</p></div>
                                                            <div><p className="text-[8px] font-black text-slate-400 uppercase">Nombre</p><p className="text-sm font-black text-slate-900">{product.name || 'Producto sin nombre'}</p><ProductOptionBadges product={product} compact /></div>
                                                            <div><p className="text-[8px] font-black text-slate-400 uppercase">ID (Guías de envío Noo)</p><p className="text-sm font-mono font-black text-slate-700">{product.id || '-'}</p></div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                </div>
                            </div>

                        {(view === 'support' || view === 'admin-support') && (

                                    {view === 'admin-support' && (
                                        <aside className="border-r border-slate-100 bg-slate-50 p-4 space-y-3">
                                            <h2 className="text-[10px] font-black uppercase tracking-widest text-slate-400">Chats de soporte</h2>
                                            <div className="space-y-2 max-h-[540px] overflow-y-auto pr-1">
                                                {supportChats.map(chat => (
                                                    <div key={chat.id || chat.chatId} className={`w-full p-3 rounded-2xl border text-[10px] font-bold ${((chat.id || chat.chatId) === activeSupportChatId) ? 'bg-white border-red-200' : 'bg-white/70 border-slate-100'}`}>
                                                        <button type="button" onClick={() => setActiveSupportChatId(chat.id || chat.chatId)} className="w-full text-left">
                                                            <p className="font-black text-slate-800 truncate">{chat.userEmail || chat.userId}</p>
                                                            <p className={`mt-1 uppercase text-[8px] font-black ${chat.status === 'closed' ? 'text-slate-300' : 'text-green-600'}`}>{chat.status === 'closed' ? 'Cerrado' : 'Activo'}</p>
                                                        </button>
                                                        <button type="button" onClick={(e) => { e.stopPropagation(); deleteSupportChat(chat); }} className="mt-2 w-full px-2 py-2 rounded-xl bg-red-50 text-red-500 hover:bg-red-500 hover:text-white text-[8px] font-black uppercase flex items-center justify-center gap-1"><Icons.Trash size={11} /> Eliminar</button>
                                                    </div>
                                                ))}
                                                {supportChats.length === 0 && <p className="text-[10px] font-bold text-slate-300 uppercase text-center py-8">Sin chats todavía</p>}
                                            </div>
                                        </aside>
                                    )}
                                    <section className={`${view === 'admin-support' ? '' : 'md:col-span-2'} flex flex-col bg-white`}>
                                        <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between gap-3">
                                            <div>
                                                <p className="text-[10px] text-red-500 font-black uppercase tracking-widest">Soporte Técnico</p>

                                                    )}
                                                    <button onClick={() => deleteSupportChat(adminSelectedSupportChat)} className="px-3 py-2 bg-red-50 text-red-500 rounded-xl text-[8px] font-black uppercase flex items-center gap-1"><Icons.Trash size={11} /> Eliminar</button>
                                                </div>
                                            )}

                                                        <p>{msg.text}</p>

                                                </div>

                                                <div className="h-full flex items-center justify-center text-center text-[10px] font-black text-slate-300 uppercase tracking-widest">Escribe un mensaje para iniciar soporte</div>

                                                <p className="text-center text-[10px] font-black text-slate-400 uppercase">Conversación cerrada</p>

                                            <button disabled={(view === 'admin-support' ? adminSelectedSupportChat : activeSupportChat)?.status === 'closed'} onClick={() => sendSupportMessage(view === 'admin-support' ? 'admin' : 'user')} className="btn-primary disabled:opacity-50"><Icons.Send /> Enviar</button>
                                        </div>
                                    </section>
                                </div>
                            </div>
                        )}

                        {view === 'operator' && (

                                        )}

                                    paymentSettings={getWalletTransferPaymentSettings()}

                                    settings={walletSettings}
                                    rechargeProcessing={walletRechargeProcessing}
                                    onSubmitRechargeTransfer={registerWalletRechargeTransfer}
                                    recharges={currentUserWalletRecharges}
                                    blockedMessage={currentUserWalletBlockedMessage}
                                />
