    <script>
        // Los scripts clásicos y Babel pueden descargarse antes de que termine el
        // módulo ES de Firebase. Esta promesa es la única puerta de arranque de la app.
        (() => {
            let settled = false;
            let timeoutId = null;
            window.FirebaseSDKReady = new Promise((resolve, reject) => {
                window.__resolveFirebaseSDK = (sdk) => {
                    if (settled) return;
                    settled = true;
                    if (timeoutId) window.clearTimeout(timeoutId);
                    resolve(sdk);
                };
                window.__rejectFirebaseSDK = (error) => {
                    if (settled) return;
                    settled = true;
                    if (timeoutId) window.clearTimeout(timeoutId);
                    reject(error instanceof Error ? error : new Error(String(error || 'Firebase no pudo inicializarse.')));
                };
                timeoutId = window.setTimeout(() => {
                    window.__rejectFirebaseSDK?.(new Error('Firebase tardó demasiado en inicializarse. Revisa la conexión y vuelve a cargar la aplicación.'));
                }, 30000);
            });
        })();
    </script>

    <script type="module">
        import { initializeApp, getApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, setPersistence, inMemoryPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, onSnapshot, deleteDoc, query, where, getDocs, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
        import "./search/search.js";
        import "./password-reset/password-reset.js";
        import "./ads-manager/ads-manager.js";
        import "./home-products/home-products.js";
        import "./product-details/product-details.js";
        import "./supermercado-module/supermercado-module.js";

        import "./new-shipment/new-shipment.js";
        import "./guide-assignment/guide-assignment.js";
        import "./conductores/conductores.js";
        import "./panel-control/panel-control.js";

        try {
            const firebaseConfig = {
                apiKey: "AIzaSyDd3WMEe3KmfHsIEMO8PEa5Cd-LMxhCBuU",
                authDomain: "saxrecords-appcreat.firebaseapp.com",
                projectId: "saxrecords-appcreat",
                storageBucket: "saxrecords-appcreat.firebasestorage.app",
                messagingSenderId: "349857441815",
                appId: "1:349857441815:web:de6d672562566158c6d452",
                measurementId: "G-D42L66FNSM"
            };

            window.firebaseConfig = firebaseConfig;
            let firebaseApp;
            try {
                firebaseApp = getApp();
            } catch (error) {
                firebaseApp = initializeApp(firebaseConfig);
            }
            window.driveMxFirebaseApp = firebaseApp;

            const firebaseSDK = {
                initializeApp, getApp, getAuth, onAuthStateChanged, signInAnonymously,
                signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut,
                setPersistence, inMemoryPersistence, getFirestore, doc, getDoc, setDoc,
                collection, onSnapshot, deleteDoc, query, where, getDocs, runTransaction,
                getStorage, ref, uploadBytes, getDownloadURL
            };
            window.FirebaseSDK = firebaseSDK;
            window.__resolveFirebaseSDK?.(firebaseSDK);
            window.dispatchEvent(new CustomEvent('drive-mx-firebase-ready', {
                detail: { app: firebaseApp, sdk: firebaseSDK }
            }));
        } catch (error) {
            console.error('Inicializar Firebase SDK:', error);
            window.FirebaseSDKInitializationError = error;
            window.__rejectFirebaseSDK?.(error);
        }
    </script>
